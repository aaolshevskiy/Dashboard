<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Дашборд">
<title>Мій дашборд</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗒️</text></svg>">
<style>

/* ── APPLE DESIGN SYSTEM ── */
:root{
  --apple-blue:#0071e3;
  --apple-blue-hover:#0077ed;
  --apple-text:#1d1d1f;
  --apple-secondary:#6e6e73;
  --apple-tertiary:#aeaeb2;
  --apple-bg:#f5f5f7;
  --apple-card:#ffffff;
  --apple-border:rgba(0,0,0,.08);
  --apple-radius:12px;
  --apple-radius-sm:8px;
  --apple-shadow:0 2px 12px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.05);
  --apple-shadow-md:0 4px 20px rgba(0,0,0,.10),0 1px 4px rgba(0,0,0,.06);
}
/* ── RESET ── */
*{box-sizing:border-box;margin:0;padding:0}
body{font-size:15px;-webkit-font-smoothing:antialiased;font-family:-apple-system,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif;background:#f0f0f0;min-height:100vh;
  display:flex;align-items:flex-start;justify-content:center;padding:16px}

/* ── BOARD ── */
.board{
  background:var(--apple-bg);
  box-shadow:none;
  width:100%;max-width:1400px;min-height:85vh;
  position:relative;
  padding-bottom:40px;
}

.board-inner{padding:20px 28px 0}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--apple-border)}
.board-title{font-size:28px;font-weight:700;color:var(--apple-text);letter-spacing:-.03em}
.topbar-right{display:flex;align-items:center;gap:10px}
.sync-status{font-size:13px;color:var(--apple-tertiary);font-weight:400}
.sync-status.ok .sync-text{color:#2a7a3a}
.sync-status.err .sync-text{color:#c0392b}
.btn{font-family:inherit;font-size:13px;padding:0 18px;height:36px;line-height:36px;border:none;
  border-radius:20px;background:rgba(0,0,0,.06);cursor:pointer;color:var(--apple-text);
  font-weight:500;letter-spacing:-.01em;transition:background .15s;display:inline-flex;align-items:center;white-space:nowrap}
.btn:hover{background:rgba(0,0,0,.1)}
.btn-primary{background:var(--apple-blue);color:#fff}
.btn-primary:hover{background:var(--apple-blue-hover)}

/* ── CALENDAR STRIP ── */
.cal-strip{
  padding:5px 0 8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;
}
.cal-strip-date{font-size:14px;font-weight:600;color:var(--apple-secondary);flex-shrink:0;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.cal-strip-events{display:flex;gap:10px;flex-wrap:wrap;flex:1}
.cal-ev{font-size:14px;white-space:nowrap;font-weight:500}
.cal-ev a{text-decoration:none;color:inherit}
.cal-ev a:hover{text-decoration:underline}
.cal-ev.past{color:#bbb}
.cal-ev.now,.cal-ev.soon{color:#c0392b}
.cal-ev.future{color:#1a1a8a}
.cal-strip-link{font-size:14px;color:#aaa;text-decoration:none;flex-shrink:0}

/* ── SECTION LABEL ── */
.section-label{font-size:13px;font-weight:600;color:var(--apple-secondary);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em}

/* ── OBJECTS GRID ── */
.objects-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:0;
  padding:0 6px;
  align-items:start;
}
.obj-card{
  padding:14px 16px 14px;
  display:flex;flex-direction:column;gap:4px;
  min-height:180px;
  background:var(--apple-card);
  border-radius:var(--apple-radius);
  box-shadow:var(--apple-shadow-md);
  margin:6px;
  transition:box-shadow .2s;
}
.obj-card:hover{box-shadow:0 8px 28px rgba(0,0,0,.13),0 2px 6px rgba(0,0,0,.07);}
.obj-card.completed{opacity:.55}
.obj-card-num{font-size:12px;color:#ccc;margin-bottom:1px}
.obj-card-name{
  font-size:16px;font-weight:600;color:var(--apple-text);
  line-height:1.3;cursor:default;letter-spacing:-.02em;
}
.obj-card-name.has-notes{}
.obj-card-addr{font-size:13px;color:var(--apple-secondary);text-decoration:none;line-height:1.3;display:block}
.obj-card-addr:hover{text-decoration:underline}
.obj-card-meta{font-size:12px;color:var(--apple-secondary);line-height:1.4}
.obj-card-dates{font-size:12px;color:var(--apple-secondary);line-height:1.4;margin-top:4px}
.obj-card-dates span{color:#aaa}
.obj-badge{
  display:inline-block;font-size:11px;background:rgba(0,113,227,.1);
  border-radius:4px;padding:1px 6px;color:var(--apple-blue);margin-right:3px;font-weight:500;
}
.obj-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#c0392b;margin-left:4px;vertical-align:middle}
.obj-m{display:inline-block;width:16px;height:16px;border:1.5px solid #888;
  border-radius:50%;text-align:center;font-size:11px;font-weight:700;
  color:#888;line-height:14px;margin-right:3px;vertical-align:middle}
.obj-star{color:#e0a020;margin-right:2px}
/* Notes under obj */
.obj-notes-list{margin-top:5px;display:flex;flex-direction:column;gap:1px}
.obj-note-row{display:flex;align-items:flex-start;gap:4px;flex-wrap:nowrap}
.obj-note-text{font-size:15px;color:var(--apple-text);cursor:pointer;line-height:1.4;flex:1;min-width:0;word-break:break-word}
.obj-note-text:hover{color:#1a1a8a}
.obj-note-text.overdue{color:#c0392b}
.obj-note-time{font-size:13px;color:var(--apple-tertiary)}
.obj-note-time.has-rem{color:#2a7a3a}
.obj-note-del{font-size:13px;border:none;background:transparent;color:#ccc;cursor:pointer;padding:0 2px;flex-shrink:0}
.obj-note-del:hover{color:#c0392b}
/* Add note input */
.obj-add-note{margin-top:4px;display:flex;align-items:center;gap:4px}
.obj-add-note input{
  font-family:-apple-system,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif;font-size:14px;border:none;
  border-bottom:1px solid #ddd;background:transparent;outline:none;
  flex:1;min-width:0;padding:0 2px;color:#1a1a1a;
}
.obj-add-note input::placeholder{color:#ccc}
.obj-add-note button{font-family:-apple-system,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif;font-size:14px;border:none;
  background:transparent;color:#bbb;cursor:pointer;padding:0 2px;flex-shrink:0}
.obj-add-note button:hover{color:#1a1a8a}

/* ── NOTES ZONE (bottom) ── */
.notes-zone{
  margin-top:20px;padding-top:12px;
}
.notes-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.note-item{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap;padding:2px 0}
.note-text{font-size:15px;color:var(--apple-text);cursor:pointer;line-height:1.4;font-weight:400;word-break:break-word}
.note-text.linked{color:var(--apple-secondary)}
.note-text:hover{text-decoration:underline}
.note-text.overdue{color:#c0392b}
.note-obj-link{font-size:15px;color:var(--apple-secondary);text-decoration:none;cursor:pointer}
.note-obj-link:hover{text-decoration:underline}
.note-time{font-size:13px;color:var(--apple-tertiary)}
.note-time.has-rem{color:#34a853}
.note-del{font-size:13px;padding:0 2px;border:none;background:transparent;color:#ccc;cursor:pointer;flex-shrink:0;line-height:1}
.note-del:hover{color:#c0392b}
/* Add note input (bottom zone) */
.notes-add{margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.notes-add input{
  font-family:-apple-system,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif;font-size:20px;border:none;
  border-bottom:1.5px solid #ddd;background:transparent;outline:none;
  flex:1;min-width:200px;max-width:480px;padding:1px 2px;color:#1a1a1a;
}
.notes-add input::placeholder{color:#ccc}
.notes-add button{font-family:-apple-system,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif;font-size:20px;border:none;
  background:transparent;color:#bbb;cursor:pointer;padding:0 4px}
.notes-add button:hover{color:#1a1a8a}
.dt-btn{font-family:-apple-system,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif;font-size:16px;color:#ccc;cursor:pointer;
  border:none;background:transparent;text-decoration:underline;text-underline-offset:2px}
.dt-btn:hover{color:#888}
.dt-row{display:none;align-items:center;gap:8px;margin-top:2px;flex-wrap:wrap}
.dt-row.vis{display:flex}
.dt-row input[type=date]{font-family:-apple-system,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif;font-size:17px;border:none;
  border-bottom:1px solid #ddd;background:transparent;outline:none;color:#888;
  -webkit-appearance:none;appearance:none}
.hour-sel{font-family:-apple-system,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif;font-size:16px;color:#888;border:none;
  border-bottom:1px solid #ddd;background:transparent;outline:none;cursor:pointer;
  -webkit-appearance:none;appearance:none}
.dt-label{font-size:15px;color:#bbb}

/* ── MODALS ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);
  z-index:100;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:20px;padding:28px 32px;
  width:480px;max-width:96vw;max-height:90vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.20),0 4px 12px rgba(0,0,0,.08)}
.modal-title{font-size:20px;font-weight:700;color:var(--apple-text);margin-bottom:20px;letter-spacing:-.03em}
.form-row{margin-bottom:12px;display:flex;flex-direction:column;gap:3px}
.form-row label{font-size:14px;color:#aaa}
.form-row input,.form-row select{
  font-family:-apple-system,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif;font-size:19px;border:none;
  border-bottom:1.5px solid #e0e0e0;background:transparent;
  color:#1a1a1a;padding:3px 2px;outline:none;
  -webkit-appearance:none;appearance:none;
}
.form-row input:focus,.form-row select:focus{border-bottom-color:#1a1a8a}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.btn-cancel{font-family:-apple-system,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif;font-size:17px;padding:4px 14px;
  border:1.5px solid #ccc;border-radius:4px;background:transparent;cursor:pointer;color:#999}
.btn-save{font-family:-apple-system,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif;font-size:17px;padding:4px 18px;
  border:1.5px solid #1a1a8a;border-radius:4px;background:#1a1a8a;cursor:pointer;color:#fff}
.fsec{font-size:14px;color:#aaa;text-transform:uppercase;letter-spacing:.06em;
  margin:14px 0 6px;border-bottom:0.5px solid #e8e8e0;padding-bottom:4px}
.err-msg{font-size:14px;color:#c0392b;display:none}

/* ── HISTORY MODAL ── */
.hist-item{background:#f9f9f8;border:0.5px solid #e8e8e0;border-radius:6px;
  padding:8px 12px;display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.hist-badge{font-size:11px;padding:2px 6px;border-radius:3px;
  background:#FCEBEB;color:#A32D2D;flex-shrink:0;margin-top:3px}
.hist-body{flex:1;min-width:0}
.hist-name{font-size:16px;font-weight:600;color:#1a1a1a}
.hist-meta{font-size:12px;color:#aaa;margin-top:1px}
.hist-restore{font-family:-apple-system,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif;font-size:14px;padding:2px 8px;
  border:1.5px solid #1a1a8a;border-radius:4px;background:transparent;
  color:#1a1a8a;cursor:pointer;flex-shrink:0}
.hist-restore:hover{background:rgba(26,26,138,.06)}

/* ── NOTE EDIT MODAL ── */
.note-edit-date-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.note-edit-date-row input[type=date]{
  min-height:36px;padding:4px 6px;border-radius:6px;
  border:1.5px solid #e0e0e0!important;
  font-size:16px!important;
  background:#fff;
  width:160px;
  -webkit-appearance:none;appearance:none;
  color:var(--apple-text);
  cursor:pointer;
}
.note-edit-date-row select{
  min-height:36px;padding:4px 6px;border-radius:6px;
  border:1.5px solid #e0e0e0!important;
  font-size:16px!important;
  background:#fff;
  -webkit-appearance:none;appearance:none;
  color:var(--apple-text);
  cursor:pointer;
}

/* ── DRAWING ── */




.mobile-add-zone{
  display:none;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  padding:8px 0 12px;
  border-bottom:1px solid var(--apple-border);
  margin-bottom:10px;
}
@media(max-width:768px){
  .mobile-add-zone{display:flex}
  .notes-add{display:none}  /* hide desktop add on mobile */
}

/* ── OVERDUE ZONE ── */
.overdue-zone{
  margin-bottom:16px;
  background:rgba(255,59,48,.05);
  border:1px solid rgba(255,59,48,.15);
  border-radius:var(--apple-radius-sm);
  padding:10px 14px;
}
.overdue-zone-title{
  font-size:11px;font-weight:600;color:rgba(255,59,48,.7);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;
  display:flex;align-items:center;gap:5px;
}
.overdue-item{
  display:flex;align-items:baseline;gap:6px;padding:2px 0;flex-wrap:wrap;
  animation:pulse-red 2s ease-in-out infinite;
}
@keyframes pulse-red{
  0%,100%{opacity:1} 50%{opacity:.7}
}
.overdue-item-text{
  font-size:15px;font-weight:500;color:rgb(255,59,48);cursor:pointer;
}
.overdue-item-obj{
  font-size:13px;color:rgba(255,59,48,.7);
}
.overdue-item-time{font-size:12px;color:rgba(255,59,48,.5);}

/* ── MOBILE ── */
@media(max-width:768px){
  body{padding:6px;min-width:unset}
  .board-inner{padding:10px 10px 0}
  /* Show objects in single column */
  .objects-grid{display:grid!important;grid-template-columns:1fr!important}
  .section-label{display:block!important}
  .overdue-zone{display:block}
  .obj-card{margin:4px 0}
  /* Notes in single column */
  .notes-cols{grid-template-columns:1fr}
  /* Compact fonts on mobile */
  .obj-card-name{font-size:15px!important}
  .obj-note-text{font-size:14px!important}
  .obj-card-addr{font-size:12px!important}
  .obj-card-dates{font-size:12px!important}
  .obj-card-meta{font-size:12px!important}
  /* Smaller topbar */
  .board-title{font-size:20px!important}
  .btn{font-size:12px!important;padding:0 12px!important;height:30px!important;line-height:30px!important}
}
@media(min-width:769px) and (max-width:1024px){
  body{padding:8px;}
  .objects-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="board">
<div class="board-inner">

<!-- TOPBAR -->
<div class="topbar">
  <div class="board-title">Мій дашборд</div>
  <div class="topbar-right">
    <div class="sync-status" id="syncStatus"><span class="sync-text" id="syncText">завантаження...</span></div>
    <button class="btn" onclick="openHistory()">📋 Історія</button>
    <button class="btn btn-primary" onclick="openAddModal()">+ Додати об'єкт</button>
  </div>
</div>

<!-- CALENDAR STRIP -->
<div class="cal-strip" id="calStrip">
  <span class="cal-strip-date" id="calStripDate"></span>
  <div class="cal-strip-events" id="calStripEvents">
    <span class="cal-ev" style="color:#ccc">завантаження...</span>
  </div>
</div>



<!-- OBJECTS -->
<div class="section-label">Об'єкти в роботі</div>
<div class="objects-grid" id="objectsGrid"></div>

<!-- NOTES ZONE -->
<div class="notes-zone">
  <!-- Mobile quick add — shown only on mobile, above notes -->
  <div id="mobileAddZone" class="mobile-add-zone">
    <input id="mobileNoteInput" placeholder="нова нотатка..."
      onkeydown="if(event.key==='Enter')addMobileNote()"
      style="font-family:inherit;font-size:15px;border:none;border-bottom:1.5px solid #ddd;
        background:transparent;outline:none;flex:1;min-width:0;padding:3px 2px;color:var(--apple-text)">
    <select id="mobileObjSelect"
      style="font-family:inherit;font-size:13px;color:var(--apple-secondary);border:none;
        border-bottom:1px solid #ddd;background:transparent;outline:none;
        cursor:pointer;-webkit-appearance:none;appearance:none;max-width:140px">
      <option value="">— без об’єкту —</option>
    </select>
    <button onclick="addMobileNote()"
      style="font-family:inherit;font-size:14px;border:none;background:transparent;
        color:var(--apple-secondary);cursor:pointer;padding:0 4px;flex-shrink:0">↵</button>
  </div>
  <div class="notes-cols">
    <div id="notesLeft"></div>
    <div id="notesRight"></div>
  </div>
  <div class="notes-add" style="margin-top:10px">
    <input id="noteAddInput" placeholder="нова нотатка..."
      onkeydown="if(event.key==='Enter')addGlobalNote()">
    <button onclick="addGlobalNote()">↵</button>
    <button class="dt-btn" id="noteDtBtn" onclick="toggleNoteDt()">+ нагадати</button>
  </div>
  <div class="dt-row" id="noteDtRow" style="padding-top:4px">
    <span class="dt-label">коли:</span>
    <input type="date" id="noteDtDate">
    <select class="hour-sel" id="noteDtHour">
      <option value="6">6:00</option><option value="7">7:00</option><option value="8">8:00</option>
      <option value="9" selected>9:00</option><option value="10">10:00</option>
      <option value="11">11:00</option><option value="12">12:00</option>
      <option value="13">13:00</option><option value="14">14:00</option>
      <option value="15">15:00</option><option value="16">16:00</option>
      <option value="17">17:00</option><option value="18">18:00</option>
      <option value="19">19:00</option><option value="20">20:00</option>
      <option value="21">21:00</option><option value="22">22:00</option>
    </select>
    <span class="dt-label">(рівно)</span>
  </div>
</div>

</div><!-- /board-inner -->



<!-- ── MODALS ── -->

<!-- ADD/EDIT OBJECT -->
<div class="overlay" id="addModal">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Новий об'єкт</div>
    <div class="fsec">Основне</div>
    <div class="form-row"><label>Назва *</label><input id="f-name" placeholder="Назва проєкту"></div>
    <div class="form-row"><label>Адреса</label><input id="f-addr" placeholder="вул. Прикладна 1, Місто"></div>
    <div class="form-row"><label>Площа м²</label><input id="f-area" type="number" placeholder="0"></div>
    <div class="form-row"><label>Пакет</label>
      <select id="f-pack">
        <option value="">—</option>
        <option>Старт</option><option>Комфорт</option><option>Преміум</option><option>ДП</option>
      </select>
    </div>
    <div class="fsec">Терміни</div>
    <div class="form-row"><label>Дата старту</label><input id="f-start" type="date"></div>
    <div class="form-row"><label>Дата фінішу</label><input id="f-end" type="date"></div>
    <div class="fsec">Додатково</div>
    <div class="form-row"><label>Прораб</label><input id="f-masters-name" placeholder="Ім'я прораба"></div>
    <div class="form-row"><label>Папка Фінал (URL)</label><input id="f-link-folder" placeholder="https://drive.google.com/..."></div>
    <div class="form-row"><label>Bitrix (URL)</label><input id="f-bitrix" placeholder="https://bitrix24..."></div>
    <div class="form-row"><label>Меблева угода (URL)</label><input id="f-furniture" placeholder="https://..."></div>
    <div class="form-row" style="flex-direction:row;gap:16px;flex-wrap:wrap;align-items:center;margin-top:6px">
      <label id="inwork-label" style="display:flex;align-items:center;gap:8px;font-size:15px;color:var(--apple-text);cursor:pointer;padding:8px 12px;border-radius:8px;background:rgba(0,0,0,.04);width:fit-content">
        <input type="checkbox" id="f-inwork" style="width:16px;height:16px;accent-color:var(--apple-blue);cursor:pointer"> ☆ В реалізації</label>

    </div>
    <div class="err-msg" id="f-err">Введіть назву</div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeAddModal()">Скасувати</button>
      <button class="btn-save" id="btnSave" onclick="saveCard()">Зберегти</button>
    </div>
  </div>
</div>

<!-- NOTE EDIT -->
<div class="overlay" id="noteModal">
  <div class="modal" style="width:420px;max-width:calc(100vw - 32px)">
    <div class="modal-title">Замітка</div>
    <div class="form-row"><label>Текст</label>
      <textarea id="nm-text" rows="3" style="font-family:-apple-system,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif;font-size:19px;
        border:1.5px solid #e0e0e0;border-radius:4px;padding:6px;width:100%;
        resize:vertical;background:transparent;outline:none"></textarea>
    </div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbyS6GtaZuWAzs-mM47yl_qkc1N3yllhYu_UadXNiVu2ESg32A5hDQ2A7IJ8Jo_-7iP-/exec";

// ── STATE ──
let objects=[], stickyNotes=[], editIdx=null, noteCtx=null;
let actionLog=[];

// ── UTILS ──
function setSyncStatus(state,text){
  const el=document.getElementById('syncStatus');
  const tx=document.getElementById('syncText');
  el.className='sync-status '+state;
  tx.textContent=text;
}
function parseBool(v){return v===true||v==='true'||v==='TRUE'||v===1||v==='1';}
function parseObj(o){
  const parsed={...o,
    inwork:parseBool(o.inwork),completed:parseBool(o.completed),masters:parseBool(o.masters),
    notes:Array.isArray(o.notes)?o.notes:(()=>{try{return JSON.parse(o.notes||'[]');}catch{return[];}})()
  };
  if(!parsed.bitrix&&parsed.linkProject) parsed.bitrix=parsed.linkProject;
  if(!parsed.furniture) parsed.furniture='';
  return parsed;
}
function mapsUrl(addr){return'https://www.google.com/maps/search/'+encodeURIComponent(addr);}
function isNoteActive(n){return!!(n.time&&new Date()>=new Date(n.time));}
function hasActiveReminder(o){return (o.notes||[]).some(isNoteActive);}
function fmtDT(iso){
  if(!iso)return'';
  const d=new Date(iso);
  if(isNaN(d))return'';
  const MONTHS=['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'];
  return d.getDate()+' '+MONTHS[d.getMonth()]+', '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function fmtDate(iso){
  if(!iso)return'';
  const d=new Date(iso);if(isNaN(d))return'';
  return d.getDate()+'.'+(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2);
}

// ── API ──
async function apiGet(){
  setSyncStatus('syncing','завантаження...');
  try{
    const res=await fetch(API_URL+'?action=getAll');
    const text=await res.text();
    let data;try{data=JSON.parse(text);}catch{setSyncStatus('err','Помилка даних');render();renderNotes();return;}
    const st=[],ob=[];
    (data||[]).forEach(o=>{
      if(String(o.id).startsWith('sticky_')||String(o.status)==='sticky'){
        const sn={...o};
        sn.col=parseInt(sn.col)||parseInt(sn.addr)||1;
        sn.notes=Array.isArray(sn.notes)?sn.notes:(()=>{try{return JSON.parse(sn.notes||'[]');}catch{return[];}})();
        st.push(sn);
      }else{ob.push(parseObj(o));}
    });
    objects=ob;stickyNotes=st;
    setSyncStatus('ok','збережено ✓');
  }catch(e){setSyncStatus('err','помилка з\'єднання');console.error(e);}
  finally{
    // Save focused input value before render
    const ae=document.activeElement;
    const savedVal=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')?ae.value:'';
    const savedId=ae?ae.id:'';
    render();renderNotes();renderOverdueZone();
    // Restore focused input
    if(savedId&&savedVal){
      const el=document.getElementById(savedId);
      if(el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA')){el.value=savedVal;el.focus();}
    }
  }
}

async function apiSave(obj){
  setSyncStatus('ok','збережено ✓'); // optimistic — show immediately
  let full;
  if(String(obj.id).startsWith('sticky_')||String(obj.status)==='sticky'){
    full={id:obj.id||'sticky_'+Date.now(),name:obj.name||'',addr:String(obj.col||1),
      stage:'',status:'sticky',pack:'',area:'',inwork:false,completed:false,masters:false,
      mastersName:'',linkProject:'',linkFolder:'',dateStart:'',dateEnd:'',
      notes:Array.isArray(obj.notes)?obj.notes:[]};
  }else{
    full={id:obj.id||'',name:obj.name||'',addr:obj.addr||'',stage:obj.stage||'',
      status:obj.status||'active',pack:obj.pack||'',area:obj.area||'',
      inwork:!!obj.inwork,completed:false,masters:false,
      mastersName:obj.mastersName||'',linkProject:obj.bitrix||'',linkFolder:obj.linkFolder||'',
      dateStart:obj.dateStart||'',dateEnd:obj.dateEnd||'',
      furniture:obj.furniture||'',
      notes:Array.isArray(obj.notes)?obj.notes:[]};
  }
  try{
    const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'save',object:full})});
    const data=await res.json();
    if(data.id)obj.id=data.id;
    setSyncStatus('ok','збережено ✓');return true;
  }catch(e){setSyncStatus('err','помилка збереження');console.error(e);return false;}
}

async function apiDelete(id){
  try{
    await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'delete',id})});
  }catch(e){console.error(e);}
}

// ── SORT ──
function sortObjects(){
  objects.sort((a,b)=>{
    if(!!a.completed!==!!b.completed)return a.completed?1:-1;
    // inwork (★) first
    if(!!a.inwork!==!!b.inwork)return a.inwork?-1:1;
    // then by dateStart asc — oldest first, no date goes last
    const da=a.dateStart?new Date(a.dateStart):null;
    const db=b.dateStart?new Date(b.dateStart):null;
    if(da&&db)return da-db;
    if(da)return -1;
    if(db)return 1;
    return 0;
  });
}

// ── RENDER OBJECTS ──
function render(){
  try{_renderObjects();}catch(e){console.error('render error:',e);}
}
function _renderObjects(){
  const grid=document.getElementById('objectsGrid');
  if(!grid)return;
  grid.innerHTML='';
  if(!objects.length){
    grid.innerHTML='<div style="font-size:20px;color:#ccc;font-style:italic;padding:16px;grid-column:1/-1">Немає об\'єктів</div>';
    return;
  }
  sortObjects();
  objects.forEach((o,i)=>{
    try{grid.appendChild(buildCard(o,i));}catch(e){
      console.error('buildCard error:',e,o);
      const d=document.createElement('div');d.className='obj-card';d.textContent=o.name||'?';grid.appendChild(d);
    }
  });
}

function buildCard(o,i){
  const card=document.createElement('div');
  card.className='obj-card'+(o.completed?' completed':'');
  card.id='card-'+i;
  card.dataset.objid=o.id;

  const hasNotes=(o.notes||[]).length>0;
  const hasRem=hasActiveReminder(o);

  // Name row with Drive+Bitrix icons
  const nameRow=document.createElement('div');
  nameRow.style.cssText='display:flex;align-items:center;gap:5px;flex-wrap:nowrap';
  const name=document.createElement('div');
  name.className='obj-card-name'+(hasNotes?' has-notes':'');
  name.style.cssText='flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
  let nameText='';
  if(o.inwork) nameText+='★ ';
  nameText+=o.name||'—';
  name.textContent=nameText;
  if(o.completed) name.style.textDecoration='line-through';
  nameRow.appendChild(name);
  if(o.linkFolder){
    const gd=document.createElement('a');gd.href=o.linkFolder;gd.target='_blank';gd.title='Google Drive';
    gd.style.cssText='display:inline-flex;flex-shrink:0;opacity:.5';
    gd.onclick=e=>e.stopPropagation();
    gd.style.cssText='display:inline-flex;flex-shrink:0;opacity:.55;align-items:center;gap:2px;font-size:11px;color:var(--apple-secondary);text-decoration:none';
    gd.innerHTML='<svg viewBox="0 0 87.3 78" width="12" height="12"><path d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/><path d="m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44a9.06 9.06 0 0 0 -1.2 4.5h27.5z" fill="#00ac47"/><path d="m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.502l5.852 11.5z" fill="#ea4335"/><path d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z" fill="#00832d"/><path d="m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684fc"/><path d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/></svg>Диск';
    nameRow.appendChild(gd);
  }
  if(o.bitrix){
    const bx=document.createElement('a');bx.href=o.bitrix;bx.target='_blank';bx.title='Bitrix';
    bx.style.cssText='display:inline-flex;flex-shrink:0;opacity:.5';
    bx.onclick=e=>e.stopPropagation();
    bx.style.cssText='display:inline-flex;flex-shrink:0;opacity:.55;align-items:center;gap:2px;font-size:11px;color:var(--apple-secondary);text-decoration:none';
    bx.innerHTML='<svg viewBox="0 0 24 24" width="12" height="12"><rect x="2" y="2" width="20" height="20" rx="4" fill="#FF5722"/><path d="M7 7h4.5a2.5 2.5 0 0 1 0 5H7zm0 5h5a2.5 2.5 0 0 1 0 5H7z" fill="white"/></svg>Bitrix';
    nameRow.appendChild(bx);
  }
  if(o.furniture){
    const fw=document.createElement('a');fw.href=o.furniture;fw.target='_blank';fw.title='Меблева угода';
    fw.style.cssText='display:inline-flex;flex-shrink:0;opacity:.55;align-items:center;gap:2px;font-size:11px;color:var(--apple-secondary);text-decoration:none';
    fw.onclick=e=>e.stopPropagation();
    fw.innerHTML='🪑 Меблі';
    nameRow.appendChild(fw);
  }
  card.appendChild(nameRow);

  // Address
  if(o.addr){
    const a=document.createElement('a');
    a.className='obj-card-addr';
    a.href=mapsUrl(o.addr);a.target='_blank';
    a.textContent=o.addr;
    card.appendChild(a);
  }

  // Meta
  const meta=document.createElement('div');
  meta.className='obj-card-meta';
  if(o.pack) meta.innerHTML+='<span class="obj-badge">'+o.pack+'</span>';
  if(o.area) meta.innerHTML+='<span class="obj-badge">'+o.area+'м²</span>';
  if(o.masters) meta.innerHTML+='<span class="obj-m">М</span>';
  if(o.mastersName) meta.innerHTML+='<span style="font-size:12px;color:#999">'+o.mastersName+'</span>';

  if(meta.innerHTML) card.appendChild(meta);


  // Dates — always shown
  const ds=fmtDate(o.dateStart), de=fmtDate(o.dateEnd);
  if(ds||de){
    const dates=document.createElement('div');
    dates.className='obj-card-dates';
    dates.innerHTML=(ds?'<span style="color:#888;font-size:11px">→</span> '+ds:'')+(ds&&de?' <span style="opacity:.4">→</span> ':'')+(de?'<span style="filter:grayscale(1)">🏁</span> '+de:'');
    card.appendChild(dates);
  }

  // Notes (always expanded)
  if(hasNotes){
    const nl=document.createElement('div');nl.className='obj-notes-list';
    // Map original indices before sort
    const withIdx=o.notes.map((n,origNi)=>({n,origNi}));
    withIdx.sort((a,b)=>isNoteActive(b.n)-isNoteActive(a.n));
    withIdx.forEach(({n,origNi})=>{
      const active=isNoteActive(n);
      const row=document.createElement('div');row.className='obj-note-row';
      const txt=document.createElement('span');
      txt.className='obj-note-text'+(active?' overdue':'');
      txt.textContent='\u2013 '+n.text;
      txt.onclick=()=>openNoteModal({type:'obj',objId:o.id,ni:origNi});
      row.appendChild(txt);
      if(n.time){
        const hasFuture=!active&&!!n.time;
        const t=document.createElement('span');
        t.className='obj-note-time'+(hasFuture?' has-rem':'');
        t.textContent=fmtDT(n.time);
        row.appendChild(t);
      }
      const del=document.createElement('button');del.className='obj-note-del';del.textContent='✕';
      del.onclick=()=>deleteObjNote(o.id,origNi);
      row.appendChild(del);
      nl.appendChild(row);
    });
    card.appendChild(nl);
  }

  // Add note input
  const addRow=document.createElement('div');addRow.className='obj-add-note';
  addRow.style.flexWrap='wrap';
  const inp=document.createElement('input');
  inp.placeholder='+ замітка...';
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addObjNoteWithTime(o.id,addRow);}};
  const btn=document.createElement('button');btn.textContent='↵';
  btn.onclick=()=>addObjNoteWithTime(o.id,addRow);
  // Reminder date+time (hidden by default)
  const dtToggle=document.createElement('button');dtToggle.textContent='+ нагадати';
  dtToggle.style.cssText='font-family:inherit;font-size:11px;color:var(--apple-tertiary);border:none;background:transparent;cursor:pointer;padding:0 2px;text-decoration:underline;flex-shrink:0';
  const dtWrap=document.createElement('div');
  dtWrap.style.cssText='display:none;align-items:center;gap:6px;width:100%;padding-top:2px;flex-wrap:wrap';
  const dtDate=document.createElement('input');dtDate.type='date';
  dtDate.style.cssText='font-family:inherit;font-size:12px;border:none;border-bottom:1px solid #ddd;background:transparent;outline:none;color:var(--apple-text);-webkit-appearance:none;appearance:none;max-width:140px';
  const dtHour=document.createElement('select');
  dtHour.style.cssText='font-family:inherit;font-size:12px;border:none;border-bottom:1px solid #ddd;background:transparent;outline:none;cursor:pointer;color:var(--apple-text);-webkit-appearance:none;appearance:none';
  dtHour.innerHTML='<option value="6">6:00</option><option value="7">7:00</option><option value="8">8:00</option><option value="9" selected>9:00</option><option value="10">10:00</option><option value="11">11:00</option><option value="12">12:00</option><option value="13">13:00</option><option value="14">14:00</option><option value="15">15:00</option><option value="16">16:00</option><option value="17">17:00</option><option value="18">18:00</option><option value="19">19:00</option><option value="20">20:00</option><option value="21">21:00</option><option value="22">22:00</option>';
  dtWrap.appendChild(dtDate);dtWrap.appendChild(dtHour);
  dtToggle.onclick=()=>{
    const vis=dtWrap.style.display==='flex';
    dtWrap.style.display=vis?'none':'flex';
    dtToggle.textContent=vis?'+ нагадати':'− прибрати';
  };
  // Edit button
  const editBtn=document.createElement('button');editBtn.textContent='✏';editBtn.title='Редагувати';
  editBtn.onclick=()=>openEditModal(o.id);
  const delBtn=document.createElement('button');delBtn.textContent='✕';delBtn.title='Видалити';
  delBtn.style.color='#e07070';
  delBtn.onclick=()=>deleteCard(o.id);
  addRow.appendChild(inp);addRow.appendChild(btn);addRow.appendChild(dtToggle);addRow.appendChild(editBtn);addRow.appendChild(delBtn);addRow.appendChild(dtWrap);
  addRow.style.marginTop='auto';addRow.style.paddingTop='6px';
  card.appendChild(addRow);

  return card;
}

// ── RENDER NOTES (bottom zone) ──
function renderOverdueZone(){
  const zone=document.getElementById('overdueZone');
  if(!zone)return;
  const now=new Date();
  const items=[];
  stickyNotes.forEach((sn,idx)=>{
    const note=sn.notes&&sn.notes.length?sn.notes[0]:null;
    if(note&&note.time&&now>=new Date(note.time))
      items.push({text:sn.name,objName:null,time:fmtDT(note.time),onClick:()=>openNoteModal({type:'sticky',idx})});
  });
  objects.forEach(o=>{
    (o.notes||[]).forEach((n,ni)=>{
      if(isNoteActive(n))
        items.push({text:n.text,objName:o.name,time:fmtDT(n.time),onClick:()=>openNoteModal({type:'obj',objId:o.id,ni})});
    });
  });
  if(!items.length){zone.style.display='none';return;}
  zone.style.display='block';
  zone.innerHTML='<div class="overdue-zone"><div class="overdue-zone-title">🔥 Протерміновано</div>'
    +items.map(it=>'<div class="overdue-item"><span class="overdue-item-text">'+it.text+'</span>'
      +(it.objName?'<span class="overdue-item-obj">('+it.objName+')</span>':'')
      +'<span class="overdue-item-time">'+it.time+'</span></div>').join('')+'</div>';
  zone.querySelectorAll('.overdue-item-text').forEach((el,i)=>{
    el.onclick=items[i].onClick;
  });
}

function renderNotes(){
  // Populate obj selectors — both desktop and mobile
  ['noteObjSelect','mobileObjSelect'].forEach(function(selId){
    const sel=document.getElementById(selId);
    if(!sel)return;
    const cur=sel.value;
    sel.innerHTML='<option value="">— без об’єкту —</option>';
    [...objects].sort((a,b)=>(a.name||'').localeCompare(b.name||'','uk')).forEach(o=>{
      const opt=document.createElement('option');
      opt.value=o.id;
      opt.textContent=o.name+(o.addr?' ('+o.addr.split(',')[0]+')':'');
      sel.appendChild(opt);
    });
    sel.value=cur;
  });
  const leftEl=document.getElementById('notesLeft');
  const rightEl=document.getElementById('notesRight');
  if(!leftEl||!rightEl)return;
  leftEl.innerHTML='';rightEl.innerHTML='';

  const now=new Date();
  const all=[];

  // Sticky notes
  stickyNotes.forEach((sn,idx)=>{
    const note=sn.notes&&sn.notes.length?sn.notes[0]:null;
    const overdue=!!(note&&note.time&&now>=new Date(note.time));
    const hasFut=!!(note&&note.time&&now<new Date(note.time));
    all.push({type:'sticky',idx,text:sn.name||'',objName:null,objAddr:null,objId:null,ni:null,
      overdue,hasFut,timeRaw:note&&note.time?new Date(note.time):null,time:note&&note.time?fmtDT(note.time):''});
  });

  // Object notes are shown under each card — NOT duplicated here

  // Sort: 1=red(overdue), 2=black(future/no-obj), 3=grey(linked obj no reminder)
  const noteRank=item=>{
    if(item.overdue) return 1;
    if(!item.objName) return 2;  // free note, black
    if(item.hasFut) return 2;    // linked but has future reminder, black
    return 3;                     // linked obj, no reminder — grey
  };
  all.sort((a,b)=>{
    const ra=noteRank(a),rb=noteRank(b);
    if(ra!==rb)return ra-rb;
    if(a.timeRaw&&b.timeRaw)return a.timeRaw-b.timeRaw;
    if(a.timeRaw)return -1;if(b.timeRaw)return 1;
    return 0;
  });

  const half=Math.ceil(all.length/2);
  all.forEach((item,i)=>{
    const el=i<half?leftEl:rightEl;
    const row=document.createElement('div');row.className='note-item';
    const txt=document.createElement('span');
    txt.className='note-text'+(item.overdue?' overdue':'')+(item.objName&&!item.overdue?' linked':'');
    txt.textContent='\u2013 '+item.text;
    txt.onclick=()=>{
      if(item.type==='sticky') openNoteModal({type:'sticky',idx:item.idx});
      else openNoteModal({type:'obj',objId:item.objId,ni:item.ni});
    };
    row.appendChild(txt);
    if(item.objName){
      const a=document.createElement('span');a.className='note-obj-link';
      a.style.cursor='pointer';a.title='Змінити об’єкт';
      a.textContent='('+item.objName+')';
      a.onclick=()=>{
        if(item.type==='sticky') openNoteModal({type:'sticky',idx:item.idx});
      };
      row.appendChild(a);
    }
    if(item.time){
      const t=document.createElement('span');
      t.className='note-time'+(item.hasFut?' has-rem':'');
      t.textContent=item.time;row.appendChild(t);
    }
    const del=document.createElement('button');del.className='note-del';del.textContent='✕';
    del.onclick=()=>{
      if(item.type==='sticky') deleteStickyNote(item.idx);
      else deleteObjNote(item.objId,item.ni);
    };
    row.appendChild(del);
    el.appendChild(row);
  });
}

// ── OBJ NOTE ACTIONS ──
async function addObjNoteWithTime(objId,addRow){
  const inp=addRow.querySelector('input[placeholder]');
  const text=inp?inp.value.trim():'';if(!text)return;
  const dtDate=addRow.querySelector('input[type=date]');
  const dtHour=addRow.querySelector('select');
  const date=dtDate?dtDate.value:'';
  const hour=dtHour?dtHour.value:'9';
  const time=date?date+'T'+String(hour).padStart(2,'0')+':00':'';
  const ri=objects.findIndex(o=>String(o.id)===String(objId));
  if(ri<0)return;
  if(!objects[ri].notes)objects[ri].notes=[];
  objects[ri].notes.push({text,time});
  inp.value='';if(dtDate)dtDate.value='';
  const dtWrap=addRow.querySelector('div');
  if(dtWrap){dtWrap.style.display='none';}
  const dtBtn=addRow.querySelector('button');if(dtBtn)dtBtn.textContent='+ нагадати';
  // Optimistic: render immediately, save in background
  render();renderNotes();renderOverdueZone();
  apiSave(objects[ri]).catch(e=>console.error(e));
}

async function addObjNote(objId,inp){

async function deleteObjNote(objId,ni){

// ── NOTE MODAL ──
function openNoteModal(ctx){
  noteCtx=ctx;
  let text='',time='';
  if(ctx.type==='sticky'){
    const sn=stickyNotes[ctx.idx];text=sn.name||'';
    const note=sn.notes&&sn.notes.length?sn.notes[0]:null;
    time=note&&note.time?note.time:'';
  }else{
    const ri=objects.findIndex(o=>String(o.id)===String(ctx.objId));
    if(ri<0)return;
    const n=objects[ri].notes[ctx.ni];text=n.text||'';time=n.time||'';
  }
  document.getElementById('nm-text').value=text;
  document.getElementById('nm-date').value=time?time.slice(0,10):'';
  const h=document.getElementById('nm-hour');
  if(h&&time) h.value=parseInt(time.slice(11,13))||9;
  document.getElementById('nm-err').style.display='none';
  // Show obj selector for sticky notes
  const objRow=document.getElementById('nm-obj-row');
  const objSel=document.getElementById('nm-obj-select');
  if(ctx.type==='sticky'&&objRow&&objSel){
    objRow.style.display='flex';
    objSel.innerHTML='<option value="">\u2014 без прив\u2019язки \u2014</option>';
    [...objects].sort((a,b)=>(a.name||'').localeCompare(b.name||'','uk')).forEach(o=>{
      const opt=document.createElement('option');opt.value=o.id;opt.textContent=o.name+(o.addr?' ('+o.addr.split(',')[0]+')':'');objSel.appendChild(opt);
    });
  }else if(objRow){objRow.style.display='none';}
  document.getElementById('noteModal').classList.add('open');
  setTimeout(()=>document.getElementById('nm-text').focus(),50);
}

function closeNoteModal(){
  document.getElementById('noteModal').classList.remove('open');
  noteCtx=null;
}

async function saveNoteModal(){
  const text=document.getElementById('nm-text').value.trim();
  if(!text){document.getElementById('nm-err').style.display='block';return;}
  const date=document.getElementById('nm-date').value;
  const hour=document.getElementById('nm-hour')?.value||'9';
  const time=date?date+'T'+String(hour).padStart(2,'0')+':00':'';
  // time='' means clear reminder

  if(noteCtx.type==='sticky'){
    const selObjId=document.getElementById('nm-obj-select')?.value||'';
    if(selObjId){
      // Convert to obj note
      const ri=objects.findIndex(o=>String(o.id)===String(selObjId));
      if(ri>=0){
        if(!objects[ri].notes)objects[ri].notes=[];
        objects[ri].notes.push({text,time});
        const delId=stickyNotes[noteCtx.idx].id;
        stickyNotes.splice(noteCtx.idx,1);
        closeNoteModal();
        try{await apiSave(objects[ri]);await apiDelete(delId);}catch(e){console.error(e);}
        render();renderNotes();return;
      }
    }
    const sn=stickyNotes[noteCtx.idx];
    sn.name=text;sn.notes=time?[{text,time}]:[];
    closeNoteModal();renderNotes();
    apiSave(sn).catch(e=>console.error(e));
  }else{
    const ri=objects.findIndex(o=>String(o.id)===String(noteCtx.objId));
    if(ri<0)return;
    objects[ri].notes[noteCtx.ni].text=text;
    objects[ri].notes[noteCtx.ni].time=time;
    closeNoteModal();render();renderNotes();
    apiSave(objects[ri]).catch(e=>console.error(e));
  }
}

}

async function saveCard(){
  try{
  const name=document.getElementById('f-name').value.trim();
  if(!name){document.getElementById('f-err').style.display='block';return;}
  const btn=document.getElementById('btnSave');btn.disabled=true;btn.textContent='Зберігаємо...';
  const obj={
    name,
    addr:document.getElementById('f-addr').value.trim(),
    area:document.getElementById('f-area').value.trim(),
    pack:document.getElementById('f-pack').value,
    dateStart:document.getElementById('f-start').value,
    dateEnd:document.getElementById('f-end').value,
    mastersName:document.getElementById('f-masters-name').value.trim(),
    linkFolder:document.getElementById('f-link-folder').value.trim(),
    bitrix:document.getElementById('f-bitrix')?.value.trim()||'',
    furniture:document.getElementById('f-furniture')?.value.trim()||'',
    inwork:document.getElementById('f-inwork').checked,
    masters:false,
    completed:false,
    status:'active',stage:'',linkProject:'',
    notes:editIdx!==null?(objects[editIdx].notes||[]):[]
  };
  if(editIdx!==null){
    // Find by id (not index) because sortObjects() may have reordered array
    const savedId=window._editObjId||( objects[editIdx]?objects[editIdx].id:null);
    if(savedId) obj.id=savedId;
    apiSave(obj).catch(e=>console.error(e));
    const realIdx=objects.findIndex(o=>String(o.id)===String(obj.id));
    if(realIdx>=0) objects[realIdx]=obj;
    else objects.push(obj);
    window._editObjId=null;
  } else {
    apiSave(obj).catch(e=>console.error(e));
    objects.push(obj);
  }
  btn.disabled=false;btn.textContent='Зберегти';
  closeAddModal();
  // Optimistic: update local state and render immediately
  render();renderNotes();renderOverdueZone();
  }catch(err){
    console.error('saveCard error:',err);
    const btn2=document.getElementById('btnSave');
    if(btn2){btn2.disabled=false;btn2.textContent='Зберегти';}
    alert('Помилка збереження: '+err.message);
  }
}

async function deleteCard(objId){
  const i=objects.findIndex(o=>String(o.id)===String(objId));
  if(i<0)return;
  const o=objects[i];
  if(!confirm('Видалити "'+o.name+'"?'))return;
  addHistory({type:'obj',label:o.name,data:{...o,notes:[...(o.notes||[])]}});
  const id=o.id;objects.splice(i,1);render();renderNotes();renderOverdueZone();
  try{await apiDelete(id);}catch(e){console.error(e);}
}

// ── CALENDAR ──
async function loadCalendar(){
  const dateEl=document.getElementById('calStripDate');
  const evEl=document.getElementById('calStripEvents');
  if(!dateEl||!evEl)return;
  const now=new Date();
  const DAYS=['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];
  const MONTHS=['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'];
  dateEl.innerHTML='<span style="font-size:15px">📅</span> '+DAYS[now.getDay()]+', '+now.getDate()+' '+MONTHS[now.getMonth()];
  try{
    const res=await fetch(API_URL+'?action=getCalendar');
    const data=await res.json();
    const todayEvs=Array.isArray(data)?data:[];

    if(!todayEvs.length){
      evEl.innerHTML='<span class="cal-ev" style="color:#ccc">Подій немає</span>';
    } else {
      evEl.innerHTML='';
      todayEvs.forEach(ev=>{
        const start=new Date(ev.start);const end=new Date(ev.end||ev.start);
        const diff=start-now;
        let cls='future';
        if(!ev.allDay){
          if(end<now)cls='past';
          else if(diff<=0||diff<=3600000)cls='now';
        }
        const timeStr=ev.allDay?'весь день':start.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
        const span=document.createElement('span');span.className='cal-ev '+cls;
        const a=document.createElement('a');
        a.href=ev.link||'https://calendar.google.com/calendar/r/day';a.target='_blank';
        a.textContent='– '+ev.title+' '+timeStr;
        span.appendChild(a);evEl.appendChild(span);
      });
    }

  }catch(e){
    evEl.innerHTML='<span style="color:#ccc;font-size:15px">Недоступно</span>';
  }
}

// ── HISTORY ──
const MAX_HIST=50;
function addHistory(entry){
  entry.time=new Date().toISOString();actionLog.unshift(entry);
  if(actionLog.length>MAX_HIST)actionLog.pop();
  try{localStorage.setItem('crm_history',JSON.stringify(actionLog));}catch{}
}
function loadHistory(){
  try{actionLog=JSON.parse(localStorage.getItem('crm_history')||'[]');}catch{actionLog=[];}
}
function openHistory(){
  const list=document.getElementById('historyList');
  const empty=document.getElementById('historyEmpty');
  list.innerHTML='';
  if(!actionLog.length){list.style.display='none';empty.style.display='block';}
  else{
    list.style.display='block';empty.style.display='none';
    actionLog.forEach((h,idx)=>{
      const d=new Date(h.time);
      const ts=d.getDate()+'.'+(d.getMonth()+1)+' '+d.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
      const item=document.createElement('div');item.className='hist-item';
      item.innerHTML='<span class="hist-badge">видалено</span><div class="hist-body"><div class="hist-name">'+h.label+'</div><div class="hist-meta">'+(h.parentName?h.parentName+' · ':'')+ts+'</div></div>';
      const btn=document.createElement('button');btn.className='hist-restore';btn.textContent='↩ Відновити';
      btn.onclick=()=>restoreHistory(idx);
      item.appendChild(btn);list.appendChild(item);
    });
  }
  document.getElementById('historyModal').classList.add('open');
}
function closeHistory(){document.getElementById('historyModal').classList.remove('open');}
async function restoreHistory(idx){
  const h=actionLog[idx];if(!h)return;
  if(h.type==='obj'){
    const o={...h.data,id:''};await apiSave(o);objects.push(parseObj(o));sortObjects();render();renderNotes();
  }else if(h.type==='note'){
    const ri=objects.findIndex(o=>String(o.id)===String(h.objId));
    if(ri>=0){if(!objects[ri].notes)objects[ri].notes=[];objects[ri].notes.push(h.data);await apiSave(objects[ri]);render();renderNotes();}
  }else if(h.type==='sticky'){
    const sn={...h.data,id:'sticky_'+Date.now()};stickyNotes.push(sn);await apiSave(sn);renderNotes();
  }
  actionLog.splice(idx,1);
  try{localStorage.setItem('crm_history',JSON.stringify(actionLog));}catch{}
  closeHistory();openHistory();
}
