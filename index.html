<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Дашборд">
<title>Мій дашборд</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗒️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── RESET ── */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#b0b0a8;min-height:100vh;
  display:flex;align-items:flex-start;justify-content:center;padding:16px}

/* ── BOARD ── */
.board{
  background:#f8f7f2;
  border-radius:4px;
  box-shadow:0 4px 24px rgba(0,0,0,.22),inset 0 0 0 1px rgba(255,255,255,.6);
  width:100%;max-width:1400px;min-height:85vh;
  position:relative;
  padding-bottom:40px;
}
/* Corner brackets */
.board::before,.board::after{content:'';position:absolute;width:22px;height:22px;border-color:#999;border-style:solid}
.board::before{top:10px;left:10px;border-width:2px 0 0 2px}
.board::after{top:10px;right:10px;border-width:2px 2px 0 0}
.board-inner{padding:18px 24px 0}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.board-title{font-size:30px;font-weight:700;color:#1a1a1a}
.topbar-right{display:flex;align-items:center;gap:10px}
.sync-status{font-size:15px;color:#aaa}
.sync-status.ok .sync-text{color:#2a7a3a}
.sync-status.err .sync-text{color:#c0392b}
.btn{font-family:'Inter',sans-serif;font-size:17px;padding:4px 14px;border:1.5px solid #888;
  border-radius:4px;background:transparent;cursor:pointer;color:#555}
.btn:hover{background:rgba(0,0,0,.05)}
.btn-primary{border-color:#1a1a8a;color:#1a1a8a}
.btn-primary:hover{background:rgba(26,26,138,.07)}

/* ── CALENDAR STRIP ── */
.cal-strip{
  padding:5px 0 8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;
}
.cal-strip-date{font-size:17px;font-weight:700;color:#888;flex-shrink:0}
.cal-strip-events{display:flex;gap:10px;flex-wrap:wrap;flex:1}
.cal-ev{font-size:16px;white-space:nowrap}
.cal-ev a{text-decoration:none;color:inherit}
.cal-ev a:hover{text-decoration:underline}
.cal-ev.past{color:#bbb}
.cal-ev.now,.cal-ev.soon{color:#c0392b}
.cal-ev.future{color:#1a1a8a}
.cal-strip-link{font-size:14px;color:#aaa;text-decoration:none;flex-shrink:0}

/* ── SECTION LABEL ── */
.section-label{font-size:22px;font-weight:700;color:#1a1a1a;margin-bottom:8px}

/* ── OBJECTS GRID ── */
.objects-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:0;
}
.obj-card{
  padding:10px 12px;
  display:flex;flex-direction:column;gap:2px;
}
.obj-card.completed{opacity:.55}
.obj-card-num{font-size:12px;color:#ccc;margin-bottom:1px}
.obj-card-name{
  font-size:26px;font-weight:700;color:#1a1a8a;
  line-height:1.2;cursor:default;
}
.obj-card-name.has-notes{
  text-decoration:underline;text-decoration-style:wavy;
  text-decoration-color:#1a1a8a;text-underline-offset:3px;
  text-decoration-thickness:1.5px;
}
.obj-card-addr{font-size:15px;color:#888;text-decoration:none;line-height:1.2;display:block}
.obj-card-addr:hover{text-decoration:underline}
.obj-card-meta{font-size:15px;color:#999;line-height:1.3}
.obj-card-dates{font-size:15px;color:#666;line-height:1.3;margin-top:3px}
.obj-card-dates span{color:#aaa}
.obj-badge{
  display:inline-block;font-size:11px;background:rgba(0,0,0,.07);
  border-radius:2px;padding:0 4px;color:#777;margin-right:2px;
}
.obj-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#c0392b;margin-left:4px;vertical-align:middle}
.obj-m{display:inline-block;width:16px;height:16px;border:1.5px solid #888;
  border-radius:50%;text-align:center;font-size:11px;font-weight:700;
  color:#888;line-height:14px;margin-right:3px;vertical-align:middle}
.obj-star{color:#e0a020;margin-right:2px}
/* Notes under obj */
.obj-notes-list{margin-top:5px;display:flex;flex-direction:column;gap:1px}
.obj-note-row{display:flex;align-items:baseline;gap:3px;flex-wrap:wrap}
.obj-note-text{font-size:19px;color:#444;cursor:pointer;line-height:1.3}
.obj-note-text:hover{color:#1a1a8a}
.obj-note-text.overdue{color:#c0392b}
.obj-note-time{font-size:13px;color:#bbb}
.obj-note-time.has-rem{color:#2a7a3a}
.obj-note-del{font-size:13px;border:none;background:transparent;color:#ddd;
  cursor:pointer;padding:0 2px;font-family:'Inter',sans-serif}
.obj-note-del:hover{color:#c0392b}
/* Add note input */
.obj-add-note{margin-top:4px;display:flex;align-items:center;gap:4px}
.obj-add-note input{
  font-family:'Inter',sans-serif;font-size:14px;border:none;
  border-bottom:1px solid #ddd;background:transparent;outline:none;
  flex:1;min-width:0;padding:0 2px;color:#1a1a1a;
}
.obj-add-note input::placeholder{color:#ccc}
.obj-add-note button{font-family:'Inter',sans-serif;font-size:14px;border:none;
  background:transparent;color:#bbb;cursor:pointer;padding:0 2px;flex-shrink:0}
.obj-add-note button:hover{color:#1a1a8a}

/* ── NOTES ZONE (bottom) ── */
.notes-zone{
  margin-top:20px;padding-top:12px;
}
.notes-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.note-item{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap;padding:2px 0}
.note-text{font-size:20px;color:#1a1a1a;cursor:pointer;line-height:1.3}
.note-text:hover{text-decoration:underline}
.note-text.overdue{color:#c0392b}
.note-obj-link{font-size:18px;color:#1a1a8a;text-decoration:none;flex-shrink:0}
.note-obj-link:hover{text-decoration:underline}
.note-time{font-size:14px;color:#bbb;flex-shrink:0}
.note-time.has-rem{color:#2a7a3a}
.note-del{font-size:12px;padding:0 4px;border-radius:2px;
  background:transparent;color:#ddd;cursor:pointer;font-family:'Inter',sans-serif;flex-shrink:0}
.note-del:hover{color:#c0392b;border-color:#c0392b}
/* Add note input (bottom zone) */
.notes-add{margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.notes-add input{
  font-family:'Inter',sans-serif;font-size:20px;border:none;
  border-bottom:1.5px solid #ddd;background:transparent;outline:none;
  flex:1;min-width:200px;max-width:480px;padding:1px 2px;color:#1a1a1a;
}
.notes-add input::placeholder{color:#ccc}
.notes-add button{font-family:'Inter',sans-serif;font-size:20px;border:none;
  background:transparent;color:#bbb;cursor:pointer;padding:0 4px}
.notes-add button:hover{color:#1a1a8a}
.dt-btn{font-family:'Inter',sans-serif;font-size:16px;color:#ccc;cursor:pointer;
  border:none;background:transparent;text-decoration:underline;text-underline-offset:2px}
.dt-btn:hover{color:#888}
.dt-row{display:none;align-items:center;gap:8px;margin-top:2px;flex-wrap:wrap}
.dt-row.vis{display:flex}
.dt-row input[type=date]{font-family:'Inter',sans-serif;font-size:17px;border:none;
  border-bottom:1px solid #ddd;background:transparent;outline:none;color:#888;
  -webkit-appearance:none;appearance:none}
.hour-sel{font-family:'Inter',sans-serif;font-size:16px;color:#888;border:none;
  border-bottom:1px solid #ddd;background:transparent;outline:none;cursor:pointer;
  -webkit-appearance:none;appearance:none}
.dt-label{font-size:15px;color:#bbb}

/* ── MODALS ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);
  z-index:100;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:#f8f7f2;border-radius:8px;padding:24px 28px;
  width:480px;max-width:96vw;max-height:90vh;overflow-y:auto;
  box-shadow:0 8px 32px rgba(0,0,0,.18)}
.modal-title{font-size:22px;font-weight:700;color:#1a1a1a;margin-bottom:16px}
.form-row{margin-bottom:12px;display:flex;flex-direction:column;gap:3px}
.form-row label{font-size:14px;color:#aaa}
.form-row input,.form-row select{
  font-family:'Inter',sans-serif;font-size:19px;border:none;
  border-bottom:1.5px solid #e0e0e0;background:transparent;
  color:#1a1a1a;padding:3px 2px;outline:none;
  -webkit-appearance:none;appearance:none;
}
.form-row input:focus,.form-row select:focus{border-bottom-color:#1a1a8a}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.btn-cancel{font-family:'Inter',sans-serif;font-size:17px;padding:4px 14px;
  border:1.5px solid #ccc;border-radius:4px;background:transparent;cursor:pointer;color:#999}
.btn-save{font-family:'Inter',sans-serif;font-size:17px;padding:4px 18px;
  border:1.5px solid #1a1a8a;border-radius:4px;background:#1a1a8a;cursor:pointer;color:#fff}
.fsec{font-size:14px;color:#aaa;text-transform:uppercase;letter-spacing:.06em;
  margin:14px 0 6px;border-bottom:0.5px solid #e8e8e0;padding-bottom:4px}
.err-msg{font-size:14px;color:#c0392b;display:none}

/* ── HISTORY MODAL ── */
.hist-item{background:#f9f9f8;border:0.5px solid #e8e8e0;border-radius:6px;
  padding:8px 12px;display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.hist-badge{font-size:11px;padding:2px 6px;border-radius:3px;
  background:#FCEBEB;color:#A32D2D;flex-shrink:0;margin-top:3px}
.hist-body{flex:1;min-width:0}
.hist-name{font-size:16px;font-weight:600;color:#1a1a1a}
.hist-meta{font-size:12px;color:#aaa;margin-top:1px}
.hist-restore{font-family:'Inter',sans-serif;font-size:14px;padding:2px 8px;
  border:1.5px solid #1a1a8a;border-radius:4px;background:transparent;
  color:#1a1a8a;cursor:pointer;flex-shrink:0}
.hist-restore:hover{background:rgba(26,26,138,.06)}

/* ── NOTE EDIT MODAL ── */
.note-edit-date-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ── DRAWING ── */


/* ── MOBILE ── */
@media(max-width:900px){
  body{padding:6px;min-width:unset}
  .board-inner{padding:12px 12px 0}
  .objects-grid{grid-template-columns:repeat(2,1fr)}
  .notes-cols{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="board">
<div class="board-inner">

<!-- TOPBAR -->
<div class="topbar">
  <div class="board-title">Мій дашборд</div>
  <div class="topbar-right">
    <div class="sync-status" id="syncStatus"><span class="sync-text" id="syncText">завантаження...</span></div>
    <button class="btn" onclick="openHistory()">📋 Історія</button>
    <button class="btn btn-primary" onclick="openAddModal()">+ Додати об'єкт</button>
  </div>
</div>

<!-- CALENDAR STRIP -->
<div class="cal-strip" id="calStrip">
  <span class="cal-strip-date" id="calStripDate"></span>
  <div class="cal-strip-events" id="calStripEvents">
    <span class="cal-ev" style="color:#ccc">завантаження...</span>
  </div>
  <a class="cal-strip-link" href="https://calendar.google.com/calendar/r/day" target="_blank">📅</a>
</div>

<!-- OBJECTS -->
<div class="section-label">Об'єкти в роботі</div>
<div class="objects-grid" id="objectsGrid"></div>

<!-- NOTES ZONE -->
<div class="notes-zone">
  <div class="notes-cols">
    <div id="notesLeft"></div>
    <div id="notesRight"></div>
  </div>
  <div class="notes-add" style="margin-top:10px">
    <input id="noteAddInput" placeholder="нова нотатка..."
      onkeydown="if(event.key==='Enter')addGlobalNote()">
    <button onclick="addGlobalNote()">↵</button>
    <button class="dt-btn" id="noteDtBtn" onclick="toggleNoteDt()">+ нагадати</button>
  </div>
  <div class="dt-row" id="noteDtRow" style="padding-top:4px">
    <span class="dt-label">коли:</span>
    <input type="date" id="noteDtDate">
    <select class="hour-sel" id="noteDtHour">
      <option value="6">6:00</option><option value="7">7:00</option><option value="8">8:00</option>
      <option value="9" selected>9:00</option><option value="10">10:00</option>
      <option value="11">11:00</option><option value="12">12:00</option>
      <option value="13">13:00</option><option value="14">14:00</option>
      <option value="15">15:00</option><option value="16">16:00</option>
      <option value="17">17:00</option><option value="18">18:00</option>
      <option value="19">19:00</option><option value="20">20:00</option>
      <option value="21">21:00</option><option value="22">22:00</option>
    </select>
    <span class="dt-label">(рівно)</span>
  </div>
</div>

</div><!-- /board-inner -->



<!-- ── MODALS ── -->

<!-- ADD/EDIT OBJECT -->
<div class="overlay" id="addModal">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Новий об'єкт</div>
    <div class="fsec">Основне</div>
    <div class="form-row"><label>Назва *</label><input id="f-name" placeholder="Назва проєкту"></div>
    <div class="form-row"><label>Адреса</label><input id="f-addr" placeholder="вул. Прикладна 1, Місто"></div>
    <div class="form-row"><label>Площа м²</label><input id="f-area" type="number" placeholder="0"></div>
    <div class="form-row"><label>Пакет</label>
      <select id="f-pack">
        <option value="">—</option>
        <option>Страт</option><option>Комфорт</option><option>Преміум</option><option>ДП</option>
      </select>
    </div>
    <div class="fsec">Терміни</div>
    <div class="form-row"><label>Дата старту</label><input id="f-start" type="date"></div>
    <div class="form-row"><label>Дата фінішу</label><input id="f-end" type="date"></div>
    <div class="fsec">Додатково</div>
    <div class="form-row"><label>Майстер</label><input id="f-masters-name" placeholder="Ім'я майстра"></div>
    <div class="form-row"><label>Папка Фінал (URL)</label><input id="f-link-folder" placeholder="https://drive.google.com/..."></div>
    <div class="form-row" style="flex-direction:row;gap:16px;flex-wrap:wrap;align-items:center;margin-top:6px">
      <label style="display:flex;align-items:center;gap:6px;font-size:17px;color:#1a1a1a;cursor:pointer">
        <input type="checkbox" id="f-inwork"> ☆ В реалізації</label>
      <label style="display:flex;align-items:center;gap:6px;font-size:17px;color:#1a1a1a;cursor:pointer">
        <input type="checkbox" id="f-masters"> М Знайти майстрів</label>
      <label style="display:flex;align-items:center;gap:6px;font-size:17px;color:#1a1a1a;cursor:pointer">
        <input type="checkbox" id="f-completed"> ✓ Завершено</label>
    </div>
    <div class="err-msg" id="f-err">Введіть назву</div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeAddModal()">Скасувати</button>
      <button class="btn-save" id="btnSave" onclick="saveCard()">Зберегти</button>
    </div>
  </div>
</div>

<!-- NOTE EDIT -->
<div class="overlay" id="noteModal">
  <div class="modal" style="width:420px">
    <div class="modal-title">Замітка</div>
    <div class="form-row"><label>Текст</label>
      <textarea id="nm-text" rows="3" style="font-family:'Inter',sans-serif;font-size:19px;
        border:1.5px solid #e0e0e0;border-radius:4px;padding:6px;width:100%;
        resize:vertical;background:transparent;outline:none"></textarea>
    </div>
    <div class="form-row"><label>Нагадування</label>
      <div class="note-edit-date-row">
        <input id="nm-date" type="date" style="font-size:18px;font-family:'Inter',sans-serif;
          border:none;border-bottom:1.5px solid #e0e0e0;background:transparent;
          outline:none;padding:2px;-webkit-appearance:none;appearance:none">
        <select class="hour-sel" id="nm-hour" style="font-size:18px">
          <option value="6">6:00</option><option value="7">7:00</option><option value="8">8:00</option>
          <option value="9" selected>9:00</option><option value="10">10:00</option>
          <option value="11">11:00</option><option value="12">12:00</option>
          <option value="13">13:00</option><option value="14">14:00</option>
          <option value="15">15:00</option><option value="16">16:00</option>
          <option value="17">17:00</option><option value="18">18:00</option>
          <option value="19">19:00</option><option value="20">20:00</option>
          <option value="21">21:00</option><option value="22">22:00</option>
        </select>
      </div>
    </div>
    <div class="form-row" id="nm-obj-row" style="display:none">
      <label>Прив'язати до об'єкту</label>
      <select id="nm-obj-select" style="font-family:'Inter',sans-serif;font-size:18px;
        border:none;border-bottom:1.5px solid #e0e0e0;background:transparent;
        outline:none;-webkit-appearance:none;appearance:none"></select>
    </div>
    <div class="err-msg" id="nm-err">Введіть текст</div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeNoteModal()">Скасувати</button>
      <button class="btn-save" onclick="saveNoteModal()">Зберегти</button>
    </div>
  </div>
</div>

<!-- HISTORY -->
<div class="overlay" id="historyModal">
  <div class="modal" style="width:540px">
    <div class="modal-title" style="display:flex;justify-content:space-between;align-items:center">
      <span>Історія</span>
      <button class="btn-cancel" style="padding:2px 8px" onclick="closeHistory()">✕</button>
    </div>
    <div id="historyList"></div>
    <div id="historyEmpty" style="font-size:17px;color:#ccc;font-style:italic;padding:12px 0">Нічого немає</div>
  </div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbyS6GtaZuWAzs-mM47yl_qkc1N3yllhYu_UadXNiVu2ESg32A5hDQ2A7IJ8Jo_-7iP-/exec";

// ── STATE ──
let objects=[], stickyNotes=[], editIdx=null, noteCtx=null;
let actionLog=[];

// ── UTILS ──
function setSyncStatus(state,text){
  const el=document.getElementById('syncStatus');
  const tx=document.getElementById('syncText');
  el.className='sync-status '+state;
  tx.textContent=text;
}
function parseBool(v){return v===true||v==='true'||v==='TRUE'||v===1||v==='1';}
function parseObj(o){
  return{...o,
    inwork:parseBool(o.inwork),completed:parseBool(o.completed),masters:parseBool(o.masters),
    notes:Array.isArray(o.notes)?o.notes:(()=>{try{return JSON.parse(o.notes||'[]');}catch{return[];}})()
  };
}
function mapsUrl(addr){return'https://www.google.com/maps/search/'+encodeURIComponent(addr);}
function isNoteActive(n){return!!(n.time&&new Date()>=new Date(n.time));}
function hasActiveReminder(o){return (o.notes||[]).some(isNoteActive);}
function fmtDT(iso){
  if(!iso)return'';
  const d=new Date(iso);
  if(isNaN(d))return'';
  const MONTHS=['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'];
  return d.getDate()+' '+MONTHS[d.getMonth()]+', '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function fmtDate(iso){
  if(!iso)return'';
  const d=new Date(iso);if(isNaN(d))return'';
  return d.getDate()+'.'+(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2);
}

// ── API ──
async function apiGet(){
  setSyncStatus('syncing','завантаження...');
  try{
    const res=await fetch(API_URL+'?action=getAll');
    const text=await res.text();
    let data;try{data=JSON.parse(text);}catch{setSyncStatus('err','Помилка даних');render();renderNotes();return;}
    const st=[],ob=[];
    (data||[]).forEach(o=>{
      if(String(o.id).startsWith('sticky_')||String(o.status)==='sticky'){
        const sn={...o};
        sn.col=parseInt(sn.col)||parseInt(sn.addr)||1;
        sn.notes=Array.isArray(sn.notes)?sn.notes:(()=>{try{return JSON.parse(sn.notes||'[]');}catch{return[];}})();
        st.push(sn);
      }else{ob.push(parseObj(o));}
    });
    objects=ob;stickyNotes=st;
    setSyncStatus('ok','збережено ✓');
  }catch(e){setSyncStatus('err','помилка з\'єднання');console.error(e);}
  finally{render();renderNotes();}
}

async function apiSave(obj){
  setSyncStatus('syncing','збереження...');
  let full;
  if(String(obj.id).startsWith('sticky_')||String(obj.status)==='sticky'){
    full={id:obj.id||'sticky_'+Date.now(),name:obj.name||'',addr:String(obj.col||1),
      stage:'',status:'sticky',pack:'',area:'',inwork:false,completed:false,masters:false,
      mastersName:'',linkProject:'',linkFolder:'',dateStart:'',dateEnd:'',
      notes:Array.isArray(obj.notes)?obj.notes:[]};
  }else{
    full={id:obj.id||'',name:obj.name||'',addr:obj.addr||'',stage:obj.stage||'',
      status:obj.status||'active',pack:obj.pack||'',area:obj.area||'',
      inwork:!!obj.inwork,completed:!!obj.completed,masters:!!obj.masters,
      mastersName:obj.mastersName||'',linkProject:'',linkFolder:obj.linkFolder||'',
      dateStart:obj.dateStart||'',dateEnd:obj.dateEnd||'',
      notes:Array.isArray(obj.notes)?obj.notes:[]};
  }
  try{
    const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'save',object:full})});
    const data=await res.json();
    if(data.id)obj.id=data.id;
    setSyncStatus('ok','збережено ✓');return true;
  }catch(e){setSyncStatus('err','помилка збереження');console.error(e);return false;}
}

async function apiDelete(id){
  try{
    await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'delete',id})});
  }catch(e){console.error(e);}
}

// ── SORT ──
function sortObjects(){
  objects.sort((a,b)=>{
    if(!!a.completed!==!!b.completed)return a.completed?1:-1;
    const rankO=o=>{
      const over=(o.notes||[]).some(isNoteActive);
      const hasN=(o.notes||[]).length>0;
      if(o.inwork&&o.masters)return over?0:hasN?1:2;
      if(o.inwork)return over?0:hasN?1:3;
      if(o.masters)return 4;
      return 5;
    };
    const ra=rankO(a),rb=rankO(b);
    if(ra!==rb)return ra-rb;
    // Within same rank: more notes first
    return (b.notes||[]).length-(a.notes||[]).length;
  });
}

// ── RENDER OBJECTS ──
function render(){
  try{_renderObjects();}catch(e){console.error('render error:',e);}
}
function _renderObjects(){
  const grid=document.getElementById('objectsGrid');
  if(!grid)return;
  grid.innerHTML='';
  if(!objects.length){
    grid.innerHTML='<div style="font-size:20px;color:#ccc;font-style:italic;padding:16px;grid-column:1/-1">Немає об\'єктів</div>';
    return;
  }
  sortObjects();
  objects.forEach((o,i)=>{
    try{grid.appendChild(buildCard(o,i));}catch(e){
      console.error('buildCard error:',e,o);
      const d=document.createElement('div');d.className='obj-card';d.textContent=o.name||'?';grid.appendChild(d);
    }
  });
}

function buildCard(o,i){
  const card=document.createElement('div');
  card.className='obj-card'+(o.completed?' completed':'');
  card.id='card-'+i;
  card.dataset.objid=o.id;

  const hasNotes=(o.notes||[]).length>0;
  const hasRem=hasActiveReminder(o);

  // Name
  const name=document.createElement('div');
  name.className='obj-card-name'+(hasNotes?' has-notes':'');
  let nameText='';
  if(o.inwork) nameText+='☆ ';
  nameText+=o.name||'—';
  name.textContent=nameText;
  if(o.completed) name.style.textDecoration='line-through';
  card.appendChild(name);

  // Address
  if(o.addr){
    const a=document.createElement('a');
    a.className='obj-card-addr';
    a.href=mapsUrl(o.addr);a.target='_blank';
    a.textContent=o.addr;
    card.appendChild(a);
  }

  // Meta
  const meta=document.createElement('div');
  meta.className='obj-card-meta';
  if(o.pack) meta.innerHTML+='<span class="obj-badge">'+o.pack+'</span>';
  if(o.area) meta.innerHTML+='<span class="obj-badge">'+o.area+'м²</span>';
  if(o.masters) meta.innerHTML+='<span class="obj-m">М</span>';
  if(o.mastersName) meta.innerHTML+='<span style="font-size:12px;color:#999">'+o.mastersName+'</span>';
  if(hasRem) meta.innerHTML+='<span class="obj-dot"></span>';
  if(meta.innerHTML) card.appendChild(meta);

  // Dates — always shown
  const ds=fmtDate(o.dateStart), de=fmtDate(o.dateEnd);
  if(ds||de){
    const dates=document.createElement('div');
    dates.className='obj-card-dates';
    dates.innerHTML=(ds?'<span>▶</span> '+ds:'')+(ds&&de?' <span>→</span> ':'')+(de?de:'');
    card.appendChild(dates);
  }

  // Notes (always expanded)
  if(hasNotes){
    const nl=document.createElement('div');nl.className='obj-notes-list';
    const sorted=[...o.notes].sort((a,b)=>isNoteActive(b)-isNoteActive(a));
    sorted.forEach((n,ni)=>{
      const active=isNoteActive(n);
      const row=document.createElement('div');row.className='obj-note-row';
      const txt=document.createElement('span');
      txt.className='obj-note-text'+(active?' overdue':'');
      txt.textContent='— '+n.text;
      txt.onclick=()=>openNoteModal({type:'obj',objId:o.id,ni});
      row.appendChild(txt);
      if(n.time){
        const hasFuture=!active&&!!n.time;
        const t=document.createElement('span');
        t.className='obj-note-time'+(hasFuture?' has-rem':'');
        t.textContent=fmtDT(n.time);
        row.appendChild(t);
      }
      const del=document.createElement('button');del.className='obj-note-del';del.textContent='✕';
      del.onclick=()=>deleteObjNote(o.id,ni);
      row.appendChild(del);
      nl.appendChild(row);
    });
    card.appendChild(nl);
  }

  // Add note input
  const addRow=document.createElement('div');addRow.className='obj-add-note';
  const inp=document.createElement('input');
  inp.placeholder='+ замітка...';
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addObjNote(o.id,inp);}};
  const btn=document.createElement('button');btn.textContent='↵';
  btn.onclick=()=>addObjNote(o.id,inp);
  // Edit button
  const editBtn=document.createElement('button');editBtn.textContent='✏';editBtn.title='Редагувати';
  editBtn.onclick=()=>openEditModal(i);
  const delBtn=document.createElement('button');delBtn.textContent='✕';delBtn.title='Видалити';
  delBtn.style.color='#e07070';
  delBtn.onclick=()=>deleteCard(i);
  addRow.appendChild(inp);addRow.appendChild(btn);addRow.appendChild(editBtn);addRow.appendChild(delBtn);
  card.appendChild(addRow);

  return card;
}

// ── RENDER NOTES (bottom zone) ──
function renderNotes(){
  const leftEl=document.getElementById('notesLeft');
  const rightEl=document.getElementById('notesRight');
  if(!leftEl||!rightEl)return;
  leftEl.innerHTML='';rightEl.innerHTML='';

  const now=new Date();
  const all=[];

  // Sticky notes
  stickyNotes.forEach((sn,idx)=>{
    const note=sn.notes&&sn.notes.length?sn.notes[0]:null;
    const overdue=!!(note&&note.time&&now>=new Date(note.time));
    const hasFut=!!(note&&note.time&&now<new Date(note.time));
    all.push({type:'sticky',idx,text:sn.name||'',objName:null,objAddr:null,objId:null,ni:null,
      overdue,hasFut,timeRaw:note&&note.time?new Date(note.time):null,time:note&&note.time?fmtDT(note.time):''});
  });

  // Object notes
  objects.forEach(o=>{
    (o.notes||[]).forEach((n,ni)=>{
      const overdue=!!isNoteActive(n);
      const hasFut=!!(n.time&&now<new Date(n.time));
      all.push({type:'objnote',idx:null,text:n.text||'',objName:o.name||'',objAddr:o.addr||'',objId:o.id,ni,
        overdue,hasFut,timeRaw:n.time?new Date(n.time):null,time:n.time?fmtDT(n.time):''});
    });
  });

  // Sort: overdue first, then by date, no-date last
  all.sort((a,b)=>{
    if(a.overdue!==b.overdue)return b.overdue-a.overdue;
    if(a.timeRaw&&b.timeRaw)return a.timeRaw-b.timeRaw;
    if(a.timeRaw)return -1;if(b.timeRaw)return 1;
    return 0;
  });

  const half=Math.ceil(all.length/2);
  all.forEach((item,i)=>{
    const el=i<half?leftEl:rightEl;
    const row=document.createElement('div');row.className='note-item';
    const txt=document.createElement('span');
    txt.className='note-text'+(item.overdue?' overdue':'');
    txt.textContent='— '+item.text;
    txt.onclick=()=>{
      if(item.type==='sticky') openNoteModal({type:'sticky',idx:item.idx});
      else openNoteModal({type:'obj',objId:item.objId,ni:item.ni});
    };
    row.appendChild(txt);
    if(item.objName){
      const a=document.createElement('a');a.className='note-obj-link';
      if(item.objAddr){a.href=mapsUrl(item.objAddr);a.target='_blank';}
      else{a.style.pointerEvents='none';}
      a.textContent='('+item.objName+')';
      row.appendChild(a);
    }
    if(item.time){
      const t=document.createElement('span');
      t.className='note-time'+(item.hasFut?' has-rem':'');
      t.textContent=item.time;row.appendChild(t);
    }
    const del=document.createElement('button');del.className='note-del';del.textContent='✕';
    del.onclick=()=>{
      if(item.type==='sticky') deleteStickyNote(item.idx);
      else deleteObjNote(item.objId,item.ni);
    };
    row.appendChild(del);
    el.appendChild(row);
  });
}

// ── OBJ NOTE ACTIONS ──
async function addObjNote(objId,inp){
  const text=inp.value.trim();if(!text)return;
  const ri=objects.findIndex(o=>String(o.id)===String(objId));
  if(ri<0)return;
  if(!objects[ri].notes)objects[ri].notes=[];
  objects[ri].notes.push({text,time:''});
  inp.value='';
  try{await apiSave(objects[ri]);}catch(e){console.error(e);}
  render();renderNotes();
}

async function deleteObjNote(objId,ni){
  const ri=objects.findIndex(o=>String(o.id)===String(objId));
  if(ri<0)return;
  addHistory({type:'note',label:objects[ri].notes[ni].text,parentName:objects[ri].name,objId,data:{...objects[ri].notes[ni]}});
  objects[ri].notes.splice(ni,1);
  try{await apiSave(objects[ri]);}catch(e){console.error(e);}
  render();renderNotes();
}

// ── STICKY NOTE ACTIONS ──
async function addGlobalNote(){
  const inp=document.getElementById('noteAddInput');
  const text=inp?inp.value.trim():'';if(!text)return;
  const date=document.getElementById('noteDtDate')?.value||'';
  const hour=document.getElementById('noteDtHour')?.value||'9';
  const time=date?date+'T'+String(hour).padStart(2,'0')+':00':'';
  const sn={id:'sticky_'+Date.now(),name:text,col:1,addr:'1',status:'sticky',
    stage:'',pack:'',area:'',inwork:false,completed:false,masters:false,
    mastersName:'',linkProject:'',linkFolder:'',dateStart:'',dateEnd:'',
    notes:time?[{text,time}]:[]};
  stickyNotes.push(sn);
  inp.value='';
  if(document.getElementById('noteDtDate')) document.getElementById('noteDtDate').value='';
  document.getElementById('noteDtRow')?.classList.remove('vis');
  document.getElementById('noteDtBtn').textContent='+ нагадати';
  try{await apiSave(sn);}catch(e){console.error(e);}
  renderNotes();
}

async function deleteStickyNote(idx){
  const sn=stickyNotes[idx];
  addHistory({type:'sticky',label:sn.name,data:{...sn}});
  const id=sn.id;stickyNotes.splice(idx,1);
  try{await apiDelete(id);}catch(e){console.error(e);}
  renderNotes();
}

function toggleNoteDt(){
  const row=document.getElementById('noteDtRow');
  const btn=document.getElementById('noteDtBtn');
  if(!row)return;
  if(row.classList.contains('vis')){row.classList.remove('vis');btn.textContent='+ нагадати';}
  else{row.classList.add('vis');btn.textContent='− прибрати';}
}

// ── NOTE MODAL ──
function openNoteModal(ctx){
  noteCtx=ctx;
  let text='',time='';
  if(ctx.type==='sticky'){
    const sn=stickyNotes[ctx.idx];text=sn.name||'';
    const note=sn.notes&&sn.notes.length?sn.notes[0]:null;
    time=note&&note.time?note.time:'';
  }else{
    const ri=objects.findIndex(o=>String(o.id)===String(ctx.objId));
    if(ri<0)return;
    const n=objects[ri].notes[ctx.ni];text=n.text||'';time=n.time||'';
  }
  document.getElementById('nm-text').value=text;
  document.getElementById('nm-date').value=time?time.slice(0,10):'';
  const h=document.getElementById('nm-hour');
  if(h&&time) h.value=parseInt(time.slice(11,13))||9;
  document.getElementById('nm-err').style.display='none';
  // Show obj selector for sticky notes
  const objRow=document.getElementById('nm-obj-row');
  const objSel=document.getElementById('nm-obj-select');
  if(ctx.type==='sticky'&&objRow&&objSel){
    objRow.style.display='flex';
    objSel.innerHTML='<option value="">\u2014 без прив\u2019язки \u2014</option>';
    [...objects].sort((a,b)=>(a.name||'').localeCompare(b.name||'','uk')).forEach(o=>{
      const opt=document.createElement('option');opt.value=o.id;opt.textContent=o.name+(o.addr?' ('+o.addr.split(',')[0]+')':'');objSel.appendChild(opt);
    });
  }else if(objRow){objRow.style.display='none';}
  document.getElementById('noteModal').classList.add('open');
  setTimeout(()=>document.getElementById('nm-text').focus(),50);
}

function closeNoteModal(){
  document.getElementById('noteModal').classList.remove('open');
  noteCtx=null;
}

async function saveNoteModal(){
  const text=document.getElementById('nm-text').value.trim();
  if(!text){document.getElementById('nm-err').style.display='block';return;}
  const date=document.getElementById('nm-date').value;
  const hour=document.getElementById('nm-hour')?.value||'9';
  const time=date?date+'T'+String(hour).padStart(2,'0')+':00':'';

  if(noteCtx.type==='sticky'){
    const selObjId=document.getElementById('nm-obj-select')?.value||'';
    if(selObjId){
      // Convert to obj note
      const ri=objects.findIndex(o=>String(o.id)===String(selObjId));
      if(ri>=0){
        if(!objects[ri].notes)objects[ri].notes=[];
        objects[ri].notes.push({text,time});
        const delId=stickyNotes[noteCtx.idx].id;
        stickyNotes.splice(noteCtx.idx,1);
        closeNoteModal();
        try{await apiSave(objects[ri]);await apiDelete(delId);}catch(e){console.error(e);}
        render();renderNotes();return;
      }
    }
    const sn=stickyNotes[noteCtx.idx];
    sn.name=text;sn.notes=time?[{text,time}]:[];
    closeNoteModal();
    try{await apiSave(sn);}catch(e){console.error(e);}
    renderNotes();
  }else{
    const ri=objects.findIndex(o=>String(o.id)===String(noteCtx.objId));
    if(ri<0)return;
    objects[ri].notes[noteCtx.ni].text=text;
    objects[ri].notes[noteCtx.ni].time=time;
    closeNoteModal();
    try{await apiSave(objects[ri]);}catch(e){console.error(e);}
    render();renderNotes();
  }
}

// ── ADD/EDIT OBJECT MODAL ──
function openAddModal(){
  editIdx=null;
  document.getElementById('modalTitle').textContent='Новий об\'єкт';
  ['f-name','f-addr','f-area','f-link-folder','f-start','f-end','f-masters-name'].forEach(id=>{
    const el=document.getElementById(id);if(el)el.value='';
  });
  ['f-inwork','f-masters','f-completed'].forEach(id=>{
    const el=document.getElementById(id);if(el)el.checked=false;
  });
  document.getElementById('f-pack').value='';
  document.getElementById('f-err').style.display='none';
  document.getElementById('addModal').classList.add('open');
  setTimeout(()=>document.getElementById('f-name').focus(),50);
}

function openEditModal(i){
  editIdx=i;const o=objects[i];if(!o)return;
  document.getElementById('modalTitle').textContent='Редагувати об\'єкт';
  document.getElementById('f-name').value=o.name||'';
  document.getElementById('f-addr').value=o.addr||'';
  document.getElementById('f-area').value=o.area||'';
  document.getElementById('f-pack').value=o.pack||'';
  document.getElementById('f-start').value=o.dateStart||'';
  document.getElementById('f-end').value=o.dateEnd||'';
  document.getElementById('f-masters-name').value=o.mastersName||'';
  document.getElementById('f-link-folder').value=o.linkFolder||'';
  document.getElementById('f-inwork').checked=!!o.inwork;
  document.getElementById('f-masters').checked=!!o.masters;
  document.getElementById('f-completed').checked=!!o.completed;
  document.getElementById('f-err').style.display='none';
  document.getElementById('addModal').classList.add('open');
}

function closeAddModal(){document.getElementById('addModal').classList.remove('open');}

async function saveCard(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){document.getElementById('f-err').style.display='block';return;}
  const btn=document.getElementById('btnSave');btn.disabled=true;btn.textContent='Збереження...';
  const obj={
    name,
    addr:document.getElementById('f-addr').value.trim(),
    area:document.getElementById('f-area').value.trim(),
    pack:document.getElementById('f-pack').value,
    dateStart:document.getElementById('f-start').value,
    dateEnd:document.getElementById('f-end').value,
    mastersName:document.getElementById('f-masters-name').value.trim(),
    linkFolder:document.getElementById('f-link-folder').value.trim(),
    inwork:document.getElementById('f-inwork').checked,
    masters:document.getElementById('f-masters').checked,
    completed:document.getElementById('f-completed').checked,
    status:'active',stage:'',linkProject:'',
    notes:editIdx!==null?(objects[editIdx].notes||[]):[]
  };
  if(editIdx!==null){obj.id=objects[editIdx].id;await apiSave(obj);objects[editIdx]=obj;}
  else{await apiSave(obj);objects.push(obj);}
  btn.disabled=false;btn.textContent='Зберегти';
  closeAddModal();render();renderNotes();
}

// ── DELETE CARD ──
async function deleteCard(i){
  const o=objects[i];if(!o)return;
  if(!confirm('Видалити "'+o.name+'"?'))return;
  addHistory({type:'obj',label:o.name,data:{...o,notes:[...(o.notes||[])]}});
  const id=o.id;objects.splice(i,1);render();renderNotes();
  try{await apiDelete(id);}catch(e){console.error(e);}
}

// ── CALENDAR ──
async function loadCalendar(){
  const dateEl=document.getElementById('calStripDate');
  const evEl=document.getElementById('calStripEvents');
  if(!dateEl||!evEl)return;
  const now=new Date();
  const DAYS=['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];
  const MONTHS=['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'];
  dateEl.textContent=DAYS[now.getDay()]+', '+now.getDate()+' '+MONTHS[now.getMonth()];
  try{
    const res=await fetch(API_URL+'?action=getCalendar');
    const data=await res.json();
    if(!Array.isArray(data)||!data.length){
      evEl.innerHTML='<span class="cal-ev" style="color:#ccc">Подій немає</span>';return;
    }
    evEl.innerHTML='';
    data.forEach(ev=>{
      const start=new Date(ev.start);const end=new Date(ev.end||ev.start);
      const diff=start-now;
      let cls='future';
      if(!ev.allDay){
        if(end<now)cls='past';
        else if(diff<=0||diff<=3600000)cls='now';
      }
      const timeStr=ev.allDay?'весь день':start.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
      const span=document.createElement('span');span.className='cal-ev '+cls;
      const a=document.createElement('a');
      a.href=ev.link||'https://calendar.google.com/calendar/r/day';a.target='_blank';
      a.textContent='— '+ev.title+' '+timeStr;
      span.appendChild(a);evEl.appendChild(span);
    });
  }catch(e){evEl.innerHTML='<span style="color:#ccc;font-size:15px">Недоступно</span>';}
}

// ── HISTORY ──
const MAX_HIST=50;
function addHistory(entry){
  entry.time=new Date().toISOString();actionLog.unshift(entry);
  if(actionLog.length>MAX_HIST)actionLog.pop();
  try{localStorage.setItem('crm_history',JSON.stringify(actionLog));}catch{}
}
function loadHistory(){
  try{actionLog=JSON.parse(localStorage.getItem('crm_history')||'[]');}catch{actionLog=[];}
}
function openHistory(){
  const list=document.getElementById('historyList');
  const empty=document.getElementById('historyEmpty');
  list.innerHTML='';
  if(!actionLog.length){list.style.display='none';empty.style.display='block';}
  else{
    list.style.display='block';empty.style.display='none';
    actionLog.forEach((h,idx)=>{
      const d=new Date(h.time);
      const ts=d.getDate()+'.'+(d.getMonth()+1)+' '+d.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
      const item=document.createElement('div');item.className='hist-item';
      item.innerHTML='<span class="hist-badge">видалено</span><div class="hist-body"><div class="hist-name">'+h.label+'</div><div class="hist-meta">'+(h.parentName?h.parentName+' · ':'')+ts+'</div></div>';
      const btn=document.createElement('button');btn.className='hist-restore';btn.textContent='↩ Відновити';
      btn.onclick=()=>restoreHistory(idx);
      item.appendChild(btn);list.appendChild(item);
    });
  }
  document.getElementById('historyModal').classList.add('open');
}
function closeHistory(){document.getElementById('historyModal').classList.remove('open');}
async function restoreHistory(idx){
  const h=actionLog[idx];if(!h)return;
  if(h.type==='obj'){
    const o={...h.data,id:''};await apiSave(o);objects.push(parseObj(o));sortObjects();render();renderNotes();
  }else if(h.type==='note'){
    const ri=objects.findIndex(o=>String(o.id)===String(h.objId));
    if(ri>=0){if(!objects[ri].notes)objects[ri].notes=[];objects[ri].notes.push(h.data);await apiSave(objects[ri]);render();renderNotes();}
  }else if(h.type==='sticky'){
    const sn={...h.data,id:'sticky_'+Date.now()};stickyNotes.push(sn);await apiSave(sn);renderNotes();
  }
  actionLog.splice(idx,1);
  try{localStorage.setItem('crm_history',JSON.stringify(actionLog));}catch{}
  closeHistory();openHistory();
}

// ── STARTUP ──
document.getElementById('addModal').addEventListener('click',function(e){if(e.target===this)closeAddModal();});
document.getElementById('noteModal').addEventListener('click',function(e){if(e.target===this)closeNoteModal();});
document.getElementById('historyModal').addEventListener('click',function(e){if(e.target===this)closeHistory();});
document.querySelector('#addModal .modal').addEventListener('click',e=>e.stopPropagation());
document.querySelector('#noteModal .modal').addEventListener('click',e=>e.stopPropagation());

loadHistory();
render();
renderNotes();
apiGet();
loadCalendar();

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){apiGet();loadCalendar();}});
window.addEventListener('pageshow',e=>{if(e.persisted){apiGet();loadCalendar();}});
setInterval(()=>{if(document.activeElement?.tagName!=='INPUT')render();},30000);
