<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мій дашборд</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Дашборд">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#b8b8b8">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23f8f7f2'/><text y='.85em' font-size='75' x='10'>🗒️</text></svg>">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗒️</text></svg>">
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22%D0%9C%D1%96%D0%B9%20%D0%B4%D0%B0%D1%88%D0%B1%D0%BE%D1%80%D0%B4%22%2C%22short_name%22%3A%22%D0%94%D0%B0%D1%88%D0%B1%D0%BE%D1%80%D0%B4%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23b8b8b8%22%2C%22theme_color%22%3A%22%23f8f7f2%22%2C%22start_url%22%3A%22.%2Fcrm.html%22%7D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;min-height:100vh}
body{
  font-family:'Caveat',cursive;
  background:#b8b8b8;
  min-height:100vh;
  padding:16px;
  display:flex;align-items:flex-start;justify-content:center;
  min-width:1200px;
  overflow-x:auto;
}

/* ── BOARD ── */
.board-outer{
  width:100%;max-width:1440px;
  background:#a8a8a8;
  border-radius:6px;padding:12px;
  box-shadow:0 4px 28px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.15);
  position:relative;
}
.board-outer::before{content:'';position:absolute;inset:0;border-radius:6px;border:2px solid rgba(255,255,255,.18);pointer-events:none;z-index:10}
.corner{position:absolute;width:26px;height:26px;z-index:20}
.corner.tl{top:6px;left:6px;border-top:4px solid #777;border-left:4px solid #777;border-radius:3px 0 0 0}
.corner.tr{top:6px;right:6px;border-top:4px solid #777;border-right:4px solid #777;border-radius:0 3px 0 0}
.corner.bl{bottom:6px;left:6px;border-bottom:4px solid #777;border-left:4px solid #777;border-radius:0 0 0 3px}
.corner.br{bottom:6px;right:6px;border-bottom:4px solid #777;border-right:4px solid #777;border-radius:0 0 3px 0}
.magnet{position:absolute;width:16px;height:16px;border-radius:50%;z-index:20;background:radial-gradient(circle at 35% 35%,#d0d8e0,#6a7a88);border:2px solid #556070;box-shadow:0 2px 4px rgba(0,0,0,.4),inset 0 1px 2px rgba(255,255,255,.3)}
.magnet.tm{top:3px;left:50%;transform:translateX(-50%)}
.magnet.bm{bottom:3px;left:50%;transform:translateX(-50%)}
.magnet.lm{left:3px;top:50%;transform:translateY(-50%)}
.magnet.rm{right:3px;top:50%;transform:translateY(-50%)}

.board-inner{
  background:#f8f7f2;
  border-radius:3px;
  padding:20px 24px 0;
  min-height:calc(100vh - 56px);
  display:flex;flex-direction:column;
  position:relative;
  box-shadow:inset 0 0 40px rgba(0,0,0,.03);
}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:8px}
.board-title{font-size:32px;font-weight:700;color:#1a1a1a}
.topbar-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sync-status{font-size:17px;color:#bbb}
.sync-status.ok{color:#2a7a3a}
.sync-status.err{color:#c0392b}
.sync-status.syncing{color:#8a6a1a}
.add-btn{font-family:'Caveat',cursive;font-size:20px;font-weight:600;padding:4px 18px;background:transparent;border:2.5px solid #1a1a1a;border-radius:3px;color:#1a1a1a;cursor:pointer}
.add-btn:hover{background:rgba(0,0,0,.04)}

/* ── LAYOUT: 2/3 left + 1/3 right ── */
.board-body{
  flex:1;
}
.objects-layout{
  display:flex;
  flex-direction:column;
  gap:0;
}
/* Row of up to 7 objects */
.obj-row{
  display:flex;
  flex-wrap:nowrap;
  gap:0;
  border-bottom:0.5px solid rgba(0,0,0,0.06);
  padding:4px 0 4px 30px;
  align-items:flex-start;
}
.obj-card{
  flex:0 0 auto;
  width:calc(100%/5);
  min-width:140px;
  padding:6px 10px 8px 0;
  border-right:0.5px solid rgba(0,0,0,0.06);
  vertical-align:top;
}
.obj-card:last-child{border-right:none}
.obj-card-name{
  font-size:20px;font-weight:700;color:#1a1a8a;
  cursor:pointer;line-height:1.2;
  display:block;margin-bottom:1px;
}
.obj-card-name.done{color:#bbb;text-decoration:line-through}
.obj-card-name.has-notes{text-decoration:underline;text-decoration-style:wavy;
  text-decoration-color:#1a1a8a;text-underline-offset:3px;text-decoration-thickness:1.5px}
.obj-card-addr{font-size:14px;color:#888;display:block;margin-bottom:2px;line-height:1.2}
.obj-card-meta{font-size:14px;color:#aaa;line-height:1.3}
.obj-card-dates{font-size:14px;color:#666;line-height:1.3;margin-top:2px}
.obj-card-star{font-size:16px;color:#e0a020;margin-right:2px}
.obj-card-badge{
  display:inline-block;font-size:12px;
  background:rgba(0,0,0,0.05);border-radius:3px;
  padding:0 4px;color:#888;margin-right:3px;
}
.obj-card-dot{
  display:inline-block;width:7px;height:7px;border-radius:50%;
  background:#c0392b;vertical-align:middle;margin-left:4px;
}
.obj-card-m{
  display:inline-block;width:18px;height:18px;border:1.5px solid #888;
  border-radius:50%;text-align:center;font-size:12px;font-weight:700;
  color:#888;line-height:16px;margin-right:3px;
}
/* Notes below the row of objects */
.obj-notes-row{
  padding:6px 0 6px 30px;
  border-bottom:0.5px solid rgba(0,0,0,0.06);
  display:flex;flex-wrap:wrap;gap:4px 20px;
}


/* ── LIST ── */
.list-item-wrap{margin-bottom:2px}
.list-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:2px 0;line-height:1.4}
.list-row-right{flex-shrink:0;margin-left:auto;padding-left:6px}
.note-icon-btn{font-family:'Caveat',cursive;font-size:20px;color:#ccc;cursor:pointer;border:none;background:transparent;padding:0 2px;line-height:1;vertical-align:middle}
.note-icon-btn:hover{color:#1a1a8a}
.note-add-under{display:flex;align-items:center;gap:6px;margin-left:28px;margin-top:3px;margin-bottom:4px}
.note-add-under input{
  font-family:'Caveat',cursive;font-size:20px;
  border:none;background:transparent;
  outline:none;color:#1a1a1a;flex:1;min-width:100px;padding:1px 2px;
}
.note-add-under input::placeholder{color:#ccc}
.note-add-under input:focus{border-bottom-color:#888}
.note-input-wrap{margin-left:28px;margin-top:2px;margin-bottom:4px}
.add-note-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.note-input-field{font-family:'Caveat',cursive;font-size:19px;border:none;background:transparent;outline:none;color:#1a1a1a;padding:1px 2px;flex:1;min-width:100px}
.note-input-field::placeholder{color:#ccc}
.note-input-field:focus{border-bottom-color:#888}
.note-submit-btn{font-family:'Caveat',cursive;font-size:18px;color:#bbb;cursor:pointer;border:none;background:transparent;padding:0 3px;flex-shrink:0}
.note-submit-btn:hover{color:#1a1a8a}
.dt-mini-btn{font-family:'Caveat',cursive;font-size:15px;color:#ccc;cursor:pointer;border:none;background:transparent;padding:0;text-decoration:underline;text-underline-offset:2px;flex-shrink:0}
.dt-mini-btn:hover{color:#888}
.list-star{font-size:28px;color:#1a1a1a;flex-shrink:0;width:24px;text-align:center}
.list-star-empty{width:24px;flex-shrink:0}
.list-star.crossed{color:#bbb;text-decoration:line-through}
.list-name{font-size:28px;font-weight:700;color:#1a1a8a;cursor:pointer;flex-shrink:0}
.list-name:hover{text-decoration:underline;text-decoration-style:wavy;text-underline-offset:4px}
.list-name.done{color:#bbb;text-decoration:line-through;text-decoration-thickness:3px}
.list-name.has-notes{text-decoration:underline;text-decoration-style:wavy;text-decoration-color:#1a1a8a;text-underline-offset:4px;text-decoration-thickness:1.5px}
.list-name.has-notes:hover{text-decoration-thickness:2px}
.list-addr-wrap{font-size:24px;color:#1a1a1a}
.list-addr-wrap a{color:#1a1a1a;text-decoration:none}
.list-addr-wrap a:hover{text-decoration:underline}
.list-pack{font-size:24px;color:#1a1a1a;font-weight:700}
.inline-select{
  font-family:'Caveat',cursive;font-size:22px;color:#888;
  border:none;
  background:transparent;outline:none;cursor:pointer;
  padding:0 2px;
  /* Safari/Chrome reset */
  -webkit-appearance:none;
  -moz-appearance:none;
  appearance:none;
}
.inline-select:focus{border-bottom-color:#1a1a8a;color:#1a1a8a}
.m-badge{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:2.5px solid #1a1a1a;font-size:18px;font-weight:700;color:#1a1a1a;margin-left:5px;flex-shrink:0;vertical-align:middle}
.reminder-dot{width:9px;height:9px;border-radius:50%;background:#c0392b;flex-shrink:0;display:inline-block;margin-left:3px;vertical-align:middle}

/* ── NOTES UNDER OBJECT ── */
.obj-notes{margin-left:28px;margin-bottom:2px;margin-top:0}
.obj-note-item{display:flex;align-items:baseline;gap:5px;padding:1px 0;line-height:1.4;flex-wrap:wrap;cursor:pointer}
.obj-note-item:hover .obj-note-text{text-decoration:underline;text-decoration-style:dotted}
.obj-note-text{font-size:20px;line-height:1.35;color:#1a1a1a}
.obj-note-text.c0{color:#1a1a1a}
.obj-note-text.c1{color:#1a1a1a}
.obj-note-text.overdue{color:#c0392b!important}
.obj-note-time{font-size:15px;color:#bbb;flex-shrink:0;white-space:nowrap}
.obj-note-del{font-size:12px;padding:0 4px;border:1px solid #eee;border-radius:2px;background:transparent;color:#ddd;cursor:pointer;font-family:'Caveat',cursive;flex-shrink:0}
.obj-note-del:hover{color:#c0392b;border-color:#c0392b}
/* object notes are hidden by default — shown in random notes zone */
.obj-notes-hidden{display:none}
.rn-obj-name{font-size:20px;color:#1a1a8a;flex-shrink:0;cursor:pointer;text-decoration:none;}
.rn-obj-name:hover{text-decoration:underline;}
.obj-note-edit-input{font-family:'Caveat',cursive;font-size:20px;color:#1a1a1a;border:none;border-bottom:1.5px solid #e0e0e0;background:transparent;outline:none;flex:1;min-width:80px;padding:0 2px}
.obj-note-edit-input:focus{border-bottom-color:#1a1a8a}

.note-datetime-row{display:none;align-items:center;gap:6px;flex-wrap:wrap;margin-left:28px;margin-top:1px}
.note-datetime-row.vis{display:flex}
.note-datetime-row input[type=date]{font-family:'Caveat',cursive;font-size:16px;border:none;background:transparent;outline:none;color:#888;padding:1px 2px;width:130px}
.note-dt-label{font-size:14px;color:#bbb}

/* ── STICKER (expanded) ── */
.exp-wrap{display:none;margin:6px 0 10px 28px;position:relative;z-index:5}
.exp-wrap.open{display:block}
.exp-layout{display:flex;gap:14px;align-items:flex-start}
.exp-notes-panel{
  background:#fffacd;
  border:1px solid #e0cc3a;
  min-width:180px;max-width:260px;
  padding:12px 14px;
  box-shadow:2px 3px 10px rgba(0,0,0,.1);
  transform:rotate(0.8deg);
}
.exp-notes-label{font-size:14px;color:#b8a820;font-weight:700;margin-bottom:6px;border-bottom:0.5px solid rgba(0,0,0,.08);padding-bottom:4px}
.exp-note-item{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap;padding:2px 0}
.exp-note-item.overdue-item .exp-note-text{color:#c0392b}
.exp-note-text{font-size:16px;color:#1a1a1a;cursor:pointer;flex:1}
.exp-note-text:hover{text-decoration:underline}
.exp-note-time{font-size:12px;color:#bbb;flex-shrink:0}
.sticker{
  background:#fffacd;
  border:1px solid #e0cc3a;
  width:240px;height:240px;
  padding:14px 15px 14px;
  position:relative;
  transform:rotate(-1.5deg);
  box-shadow:3px 4px 14px rgba(0,0,0,.14),inset 0 -2px 0 rgba(0,0,0,.04);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.sticker::before{content:'';position:absolute;top:0;left:0;right:0;height:7px;background:linear-gradient(to bottom,rgba(200,180,30,.3),transparent);pointer-events:none}
.sticker-title{font-size:19px;font-weight:700;color:#1a1a1a;border-bottom:0.5px solid rgba(0,0,0,.08);padding-bottom:5px;margin-bottom:6px;flex-shrink:0}
.sticker-fields{display:flex;flex-direction:column;gap:3px;flex:1;overflow:hidden}
.sticker-row{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.sticker-label{font-size:13px;color:#b8a820;flex-shrink:0}
.sticker-val{font-size:17px;color:#1a1a1a;font-weight:600}
.sticker-select{
  font-family:'Caveat',cursive;font-size:16px;color:#1a1a1a;
  border:none;border-bottom:0.5px solid rgba(0,0,0,.1);
  background:transparent;outline:none;cursor:pointer;font-weight:600;max-width:130px;
  -webkit-appearance:none;-moz-appearance:none;appearance:none;
}
.sticker-select:focus{border-bottom-color:#8a7000}
.sticker-input{font-family:'Caveat',cursive;font-size:16px;color:#1a1a1a;border:none;border-bottom:0.5px solid rgba(0,0,0,.1);background:transparent;outline:none;width:100%}
.sticker-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.sticker-link{font-size:15px;color:#8a7000;text-decoration:none;border-bottom:1px solid #c8a820}
.sticker-link:hover{opacity:.7}
.sticker-divider{border:none;border-top:0.5px solid rgba(0,0,0,.08);margin:5px 0}
.sticker-actions{display:flex;gap:4px;flex-wrap:wrap;flex-shrink:0}
.sticker-btn{font-family:'Caveat',cursive;font-size:14px;padding:2px 8px;border:1.5px solid rgba(0,0,0,.15);border-radius:3px;background:rgba(255,255,255,.5);color:#555;cursor:pointer;white-space:nowrap}
.sticker-btn:hover{background:rgba(255,255,255,.85)}
.sticker-btn.red:hover{color:#c0392b;border-color:#c0392b}
.sticker-btn.col{font-size:13px;color:#aaa}

/* ── TOP RANDOM NOTES STRIP ── */
/* ── CALENDAR ZONE ── */
.calendar-zone{
  margin-bottom:16px;
  padding-left:90px;
}
.calendar-zone-header{
  display:flex;align-items:center;gap:10px;margin-bottom:8px;
}
.calendar-title{font-size:20px;font-weight:700;color:#1a1a1a}
.calendar-week{font-size:16px;color:#aaa}
.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:0 8px;
  align-items:start;
}
.cal-day{display:flex;flex-direction:column;gap:3px;min-height:20px}
.cal-day-label{font-size:14px;color:#aaa;margin-bottom:3px;text-align:center}
.cal-day-label.today{color:#1a1a8a;font-weight:700}
.cal-event{
  font-size:16px;color:#1a1a1a;line-height:1.3;
  padding:2px 6px;border-radius:4px;
  background:rgba(26,26,138,0.06);
  cursor:default;
}
.cal-event.cal-today{background:rgba(26,26,138,0.12);font-weight:600}
.cal-event-time{font-size:13px;color:#aaa;display:block}
.cal-event-allday{font-size:13px;color:#888;font-style:italic}
.cal-empty{font-size:14px;color:#ddd;font-style:italic;text-align:center}
.cal-loading{font-size:16px;color:#bbb;font-style:italic}

.random-notes-zone{display:none!important;
  margin-bottom:20px;
  padding-bottom:14px;
  padding-left:90px;
  display:grid;
  grid-template-columns:1.2fr 1.2fr 0.8fr;
  gap:0 24px;
}
.random-notes-col{}
/* Calendar column */
/* ── TEAR-OFF CALENDAR ── */
.cal-tearoff{
  background:#fff;
  border-radius:4px;
  box-shadow:0 2px 10px rgba(0,0,0,.12),0 1px 0 rgba(0,0,0,.06);
  overflow:hidden;
  width:100%;
  max-width:308px;
  position:relative;
  font-family:'Caveat',cursive;
  border:0.5px solid #e8e8e0;
}
/* Spiral holes at top */
.cal-spirals{
  position:absolute;top:-1px;left:0;right:0;
  display:flex;justify-content:space-around;
  padding:0 8px;z-index:3;
}
.cal-spiral{
  width:9px;height:9px;border-radius:50%;
  background:#f4f0e6;
  border:1.5px solid #ccc;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.1);
  margin-top:-4px;
}
/* White header */
.cal-header{
  background:#fff;
  padding:10px 8px 6px;
  text-align:center;
  position:relative;
  border-bottom:0.5px solid #f0f0ee;
}
.cal-month-name{
  font-size:9px;font-weight:600;color:#aaa;
  text-transform:uppercase;letter-spacing:.12em;margin-bottom:0;
}
.cal-day-num{
  font-size:39px;font-weight:700;color:#c0392b;
  line-height:1;margin:1px 0 1px;
}
.cal-weekday{
  font-size:11px;font-weight:600;color:#888;
  letter-spacing:.04em;
}
/* Body with events */
.cal-body{
  background:#fff;
  padding:8px 9px 9px;
  min-height:28px;
}
.cal-ev-item{display:inline-flex;align-items:baseline;gap:4px;flex-wrap:wrap;padding:2px 0;width:100%;}
.cal-ev-title{font-size:19px;line-height:1.3}
.cal-ev-time{font-size:14px;flex-shrink:0}
/* Color states — applied to item row */
.cal-ev-item.cal-ev-past .cal-ev-title{color:#ccc}
.cal-ev-item.cal-ev-past .cal-ev-time{color:#ddd}
.cal-ev-item.cal-ev-now .cal-ev-title,.cal-ev-item.cal-ev-now .cal-ev-time{color:#c0392b;font-weight:700}
.cal-ev-item.cal-ev-soon .cal-ev-title,.cal-ev-item.cal-ev-soon .cal-ev-time{color:#c0392b}
.cal-ev-item.cal-ev-future .cal-ev-title,.cal-ev-item.cal-ev-future .cal-ev-time{color:#1a1a8a}
.cal-ev-title{font-size:22px;line-height:1.35;color:#1a1a1a}
.cal-ev-time{font-size:15px;flex-shrink:0;color:#888}
.cal-ev-allday{font-size:11px;color:#aaa;font-style:italic}
.cal-empty-msg{font-size:12px;color:#ccc;font-style:italic}
.cal-loading-msg{font-size:12px;color:#bbb;font-style:italic}
.random-notes-list{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.random-note-item{
  display:inline-flex;align-items:baseline;gap:4px;flex-wrap:wrap;
  padding:2px 0;width:100%;
}
.random-note-text{
  font-size:22px;color:#1a1a1a;line-height:1.35;cursor:pointer;flex-shrink:0;
  outline:none;
}
.random-note-text.overdue{color:#c0392b}
.random-note-time{font-size:15px;color:#bbb;flex-shrink:0;white-space:nowrap}
.random-note-time.has-reminder{color:#2a7a3a;font-weight:500}
.random-note-del{font-size:12px;padding:0 4px;border:1px solid #eee;border-radius:2px;background:transparent;color:#ddd;cursor:pointer;font-family:'Caveat',cursive;flex-shrink:0}
.random-note-del:hover{color:#c0392b;border-color:#c0392b}

.random-add-row{display:flex;align-items:center;gap:8px}
.random-add-input{
  font-family:'Caveat',cursive;font-size:22px;
  border:none;
  background:transparent;outline:none;color:#1a1a1a;
  flex:1;min-width:80px;padding:1px 0;
  -webkit-appearance:none;
}
.random-add-input::placeholder{color:#ccc;font-style:italic}
.random-add-btn{font-family:'Caveat',cursive;font-size:20px;color:#ccc;cursor:pointer;border:none;background:transparent;padding:0 4px}
.random-add-btn:hover{color:#1a1a8a}
.random-dt-btn{font-family:'Caveat',cursive;font-size:16px;color:#ccc;cursor:pointer;border:none;background:transparent;text-decoration:underline;text-underline-offset:2px}
.random-dt-btn:hover{color:#888}
.random-dt-row{display:none;align-items:center;gap:8px;margin-top:2px}

<script>
const API_URL="https://script.google.com/macros/s/AKfycbyS6GtaZuWAzs-mM47yl_qkc1N3yllhYu_UadXNiVu2ESg32A5hDQ2A7IJ8Jo_-7iP-/exec";
const MONTHS_GEN=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];

function fmtDateShort(iso){if(!iso)return null;const[y,m,d]=iso.split('-');return parseInt(d)+' '+MONTHS_GEN[parseInt(m)-1];}
function fmtDT(iso){if(!iso)return'';const d=new Date(iso);return d.getDate()+' '+MONTHS_GEN[d.getMonth()]+', '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}

// ── HISTORY ──────────────────────────────────────────────
const MAX_HISTORY = 50;
let actionLog = [];

function addHistory(entry){
  // entry: {type:'note'|'obj'|'randomNote', action:'delete'|'edit', label, data, restore}
  entry.time = new Date().toISOString();
  actionLog.unshift(entry);
  if(actionLog.length > MAX_HISTORY) actionLog.pop();
  try{ localStorage.setItem('crm_history', JSON.stringify(actionLog)); }catch(e){}
}

function loadActionLog(){
  try{ actionLog = JSON.parse(localStorage.getItem('crm_history')||'[]'); }catch(e){ actionLog=[]; }
}

function openHistoryModal(){
  renderHistoryList();
  document.getElementById('historyModal').classList.add('open');
}
function closeHistoryModal(){
  document.getElementById('historyModal').classList.remove('open');

function renderHistoryList(){
  const list = document.getElementById('historyList');
  const empty = document.getElementById('historyEmpty');
  list.innerHTML = '';
  if(!actionLog.length){ list.style.display='none'; empty.style.display='block'; return; }
  list.style.display='flex'; empty.style.display='none';
  actionLog.forEach((h,idx)=>{
    const d = new Date(h.time);
    const timeStr = d.toLocaleDateString('uk-UA',{day:'2-digit',month:'2-digit'}) + ' ' +
                    d.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
    const badgeClass = h.action==='delete' ? 'del' : (h.type==='obj' ? 'obj' : 'note');
    const badgeText = h.action==='delete' ? 'видалено' : 'змінено';
    const typeText = h.type==='obj' ? 'Об\'єкт' : h.type==='note' ? 'Замітка' : 'Нотатка';
    const item = document.createElement('div');
    item.className = 'hist-item';
    item.innerHTML = `
      <span class="hist-badge ${badgeClass}">${badgeText}</span>
      <div class="hist-body">
        <div class="hist-name">${h.label||'—'}</div>
        <div class="hist-meta">${typeText} · ${timeStr}${h.parentName?' · '+h.parentName:''}</div>
      </div>
      <button class="hist-restore" onclick="restoreFromHistory(${idx})">↩ Відновити</button>`;
    list.appendChild(item);
  });
}

async function restoreFromHistory(idx){
  const h = actionLog[idx];
  if(!h) return;
  try{
    if(h.type==='obj'){
      // Restore deleted object
      const obj = {...h.data};
      obj.id = ''; // get new id
      await apiSave(obj);
      objects.push(parseObj(obj));
      sortObjects();
      render();
    } else if(h.type==='note'){
      // Restore note to object
      const ri = objects.findIndex(o=>String(o.id)===String(h.objId));
      if(ri>=0){
        if(!objects[ri].notes) objects[ri].notes=[];
        objects[ri].notes.push(h.data);
        // Find slot in DOM
        const wrap = [...document.querySelectorAll('[data-objid]')].find(w=>String(w.dataset.objid)===String(h.objId));
        const slot = wrap ? parseInt(wrap.id.replace('wrap-','')) : ri;
        const notesEl = document.getElementById('notes-'+slot);
        if(notesEl) notesEl.innerHTML = buildNotesHTML(objects[ri], slot);
        await apiSave(objects[ri]);
      }
    } else if(h.type==='randomNote'){
      // Restore random note
      const sn = {...h.data};
      sn.id = 'sticky_'+Date.now();
      stickyNotes.push(sn);
      renderRandomNotes();
      await apiSave(sn);
    }
    // Remove from actionLog after restore
    actionLog.splice(idx,1);
    try{ localStorage.setItem('crm_history', JSON.stringify(actionLog)); }catch(e){}
    renderHistoryList();
  }catch(err){ console.error('restoreFromHistory error:',err); }
}

function parseBool(v){ return v===true||v==='true'||v==='TRUE'||v===1||v==='1'; }

function parseObj(o){
  return {
    ...o,
    inwork:    parseBool(o.inwork),
    completed: parseBool(o.completed),
    masters:   parseBool(o.masters),
    notes: Array.isArray(o.notes) ? o.notes : (()=>{ try{ return JSON.parse(o.notes||'[]'); }catch(e){ return []; } })()
  };
}

// ── CALENDAR ──────────────────────────────────────────────
const DAY_NAMES=['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];
const DAY_NAMES_FULL=['Неділя','Понеділок','Вівторок','Середа','Четвер','Пятниця','Субота'];

function getWeekDates(){
  const now=new Date();
  const dow=now.getDay();
  const mon=new Date(now);
  mon.setDate(now.getDate()-(dow===0?6:dow-1));
  mon.setHours(0,0,0,0);
  const days=[];
  for(let i=0;i<7;i++){
    const d=new Date(mon);
    d.setDate(mon.getDate()+i);
    days.push(d);
  }
  return days;
}

function fmtWeekLabel(days){
  const fmt=d=>d.getDate()+' '+['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'][d.getMonth()];
  return fmt(days[0])+' — '+fmt(days[6]);
}

function renderCalendar(events){
  const container=document.getElementById('calWeekEvents');
  if(!container)return;
  container.innerHTML='';
  const now=new Date();
  const todayStart=new Date(now);todayStart.setHours(0,0,0,0);
  const todayEnd=new Date(now);todayEnd.setHours(23,59,59,999);

  // Filter only today's events
  const todayEvents=events.filter(ev=>{
    const evDate=new Date(ev.start);
    return evDate>=todayStart&&evDate<=todayEnd;
  }).sort((a,b)=>new Date(a.start)-new Date(b.start));

  if(!todayEvents.length){
    container.innerHTML='<div class="cal-empty-msg">Сьогодні подій немає</div>';
    return;
  }

  todayEvents.forEach(ev=>{
    // Determine color class
    var colorCls='cal-ev-future';
    if(!ev.allDay){
      var start=new Date(ev.start);
      var end=new Date(ev.end||ev.start);
      var diffMs=start-now;
      if(end<now) colorCls='cal-ev-past';
      else if(diffMs<=0) colorCls='cal-ev-now';
      else if(diffMs<=60*60*1000) colorCls='cal-ev-soon';
      else colorCls='cal-ev-future';
    }

    var row=document.createElement('div');
    row.className='cal-ev-item '+colorCls;  // color class on row

    var titleEl=document.createElement(ev.link?'a':'span');
    titleEl.className='cal-ev-title';
    titleEl.textContent='— '+ev.title;
    if(ev.link){
      titleEl.href=ev.link;
      titleEl.target='_blank';
      titleEl.style.cssText='text-decoration:none;cursor:pointer';
    }
    titleEl.title=ev.title;
    row.appendChild(titleEl);

    if(!ev.allDay){
      var t=new Date(ev.start);
      var timeEl=document.createElement('span');
      timeEl.className='cal-ev-time';
      timeEl.textContent=t.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
      row.appendChild(timeEl);
    } else {
      var allDayEl=document.createElement('span');
      allDayEl.className='cal-ev-allday';
      allDayEl.textContent='весь день';
      row.appendChild(allDayEl);
    }
    container.appendChild(row);
  });
}

    'ЛИПЕНЬ','СЕРПЕНЬ','ВЕРЕСЕНЬ','ЖОВТЕНЬ','ЛИСТОПАД','ГРУДЕНЬ'];
  const WEEKDAYS=['НЕДІЛЯ','ПОНЕДІЛОК','ВІВТОРОК','СЕРЕДА','ЧЕТВЕР','ПЯТНИЦЯ','СУБОТА'];

async function apiGet(){
  setSyncStatus('syncing','завантаження...');
  try{
    const res = await fetch(API_URL + '?action=getAll');
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch(e) {
      setSyncStatus('err','Помилка даних');
      render(); renderRandomNotes(); return;
    }
    const stickies=[];
    const objs=[];
    (data||[]).forEach(o=>{
      if(String(o.id).startsWith('sticky_')||String(o.status)==='sticky'){
        const sn={...o};
        sn.col=parseInt(sn.col)||parseInt(sn.addr)||0;
        sn.notes=Array.isArray(sn.notes)?sn.notes:(()=>{try{return JSON.parse(sn.notes||'[]');}catch(e){return[];}})();
        stickies.push(sn);
      } else {
        objs.push(parseObj(o));
      }
    });
    objects=objs;
    stickyNotes=stickies;
    setSyncStatus('ok','збережено ✓');
  }catch(e){
    if(e&&e.name==='AbortError'){
      setSyncStatus('err','тайм-аут — перевірте Apps Script');
    } else {
      setSyncStatus('err','помилка з\'єднання');
    }
    console.error('[CRM] apiGet error:',e&&e.name, e&&e.message);
  }finally{
    render();
    renderRandomNotes();
    if(isMobile()) renderMobNotes();
  }
}
async function apiSave(obj){
  setSyncStatus('syncing','збереження...');
  let full;
  if(String(obj.id).startsWith('sticky_')||!obj.id){
    // Sticky/random note — preserve all fields as-is, especially col stored in addr
    full={
      id:    obj.id||'sticky_'+Date.now(),
      name:  obj.name||'',
      addr:  obj.addr||'0',
      stage: '',
      status:'sticky',
      pack:  '',
      area:  '',
      inwork:false,
      completed:false,
      masters:false,
      mastersName:'',
      linkProject:'',
      linkFolder:'',
      dateStart:'',
      dateEnd:'',
      notes: Array.isArray(obj.notes)?obj.notes:[]
    };
  } else {
    full={
      id:         obj.id||'',
      name:       obj.name||'',
      addr:       obj.addr||'',
      stage:      obj.stage||'',
      status:     obj.status||'active',
      pack:       obj.pack||'',
      area:       obj.area||'',
      inwork:     !!obj.inwork,
      completed:  !!obj.completed,
      masters:    !!obj.masters,
      mastersName:obj.mastersName||'',
      linkProject:obj.linkProject||'',
      linkFolder: obj.linkFolder||'',
      dateStart:  obj.dateStart||'',
      dateEnd:    obj.dateEnd||'',
      notes:      Array.isArray(obj.notes)?obj.notes:[]
    };
  }
  try{
    // POST with text/plain — no CORS preflight, works from GitHub Pages
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'save', object: full })
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    if(data.id) obj.id = data.id;
    setSyncStatus('ok','збережено ✓');
    return true;
  }catch(e){ console.error('apiSave error:',e); setSyncStatus('err','помилка збереження'); return false; }
}
async function apiDelete(id){

// ── RENDER OBJECTS ──
function sortObjects(){
  const rank=o=>{
    const isCompleted = o.completed===true||o.completed==='true'||o.completed==='TRUE'||o.completed===1;
    if(isCompleted) return 6; // завершені — завжди в самому низу
    const isInwork = o.inwork===true||o.inwork==='true'||o.inwork==='TRUE'||o.inwork===1;
    const isMasters = o.masters===true||o.masters==='true'||o.masters==='TRUE'||o.masters===1;
    const notes=Array.isArray(o.notes)?o.notes:[];
    const hasOverdue=notes.some(isNoteActive);
    const hasNotes=notes.length>0;
    if(isInwork&&isMasters){
      if(hasOverdue) return 0;
      if(hasNotes)   return 1;
      return 2;
    }
    if(isInwork){
      if(hasOverdue) return 0;
      if(hasNotes)   return 1;
      return 3;
    }
    if(isMasters) return 4;
    return 5;
  };
  // Stable sort with explicit numeric rank + original-index tiebreaker
  const withIdx=objects.map((o,idx)=>({o,idx,r:rank(o)}));
  withIdx.sort((a,b)=> a.r-b.r || a.idx-b.idx);
  objects=withIdx.map(x=>x.o);
}

function objIdx(id){
  return objects.findIndex(o=>String(o.id)===String(id));
}

// Estimate row length in characters (name + addr + pack + area + stage)
function estimateRowLen(o){
  let len=0;
  if(o.inwork) len+=2;       // ☆
  if(o.masters) len+=4;      // М + circle
  if(o.name) len+=o.name.length;
  if(o.addr) len+=o.addr.length+3; // (addr)
  if(o.area) len+=String(o.area).length+3; // Xм²
  if(o.pack) len+=o.pack.length+2;
  if(o.stage) len+=0; // stage no longer in row
  return len;
}

// Threshold: if row fits in 1/3 width (~40 chars), put in right col
const SHORT_THRESHOLD = 38;

function render(){
  const layout=document.getElementById('objectsLayout');
  if(!layout) return;
  layout.innerHTML='';
  if(!objects.length){
    layout.innerHTML='<div style="font-size:22px;color:#ccc;font-style:italic;padding:8px 30px">Немає об\'єктів...</div>';
    return;
  }
  sortObjects();
  const PER_ROW=5;
  for(let r=0;r<objects.length;r+=PER_ROW){
    const rowObjs=objects.slice(r,r+PER_ROW);
    // Object cards row
    const row=document.createElement('div');
    row.className='obj-row';
    rowObjs.forEach((o,j)=>{
      const i=r+j;
      const card=buildObjCard(o,i,i+1);
      row.appendChild(card);
    });
    layout.appendChild(row);

  }
}

function fmtDateShortStr(iso){
  if(!iso) return '';
  const d=new Date(iso);
  if(isNaN(d)) return '';
  return d.getDate()+'.'+(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2);
}

function buildObjCard(o,i,num){
  const card=document.createElement('div');
  card.className='obj-card';
  card.id='wrap-'+i;
  card.dataset.objid=o.id;

  const hasNotes=o.notes&&o.notes.length>0;
  const hasReminder=hasActiveReminder(o);

  // Name — no click handler
  const name=document.createElement('span');
  name.className='obj-card-name'+(o.completed?' done':'')+(hasNotes?' has-notes':'');
  name.textContent=(o.inwork?'☆ ':'')+o.name;
  card.appendChild(name);

  // Address
  if(o.addr){
    const addr=document.createElement('a');
    addr.className='obj-card-addr';
    addr.href=mapsUrl(o.addr);addr.target='_blank';
    addr.textContent=o.addr.split(',')[0];
    card.appendChild(addr);
  }

  // Meta: pack, area, M badge, dot
  const meta=document.createElement('div');
  meta.className='obj-card-meta';
  if(o.pack) meta.innerHTML+='<span class="obj-card-badge">'+o.pack+'</span>';
  if(o.area) meta.innerHTML+='<span style="font-size:13px;color:#aaa">'+o.area+'м²</span> ';
  if(o.masters) meta.innerHTML+='<span class="obj-card-m">М</span>';
  if(hasReminder) meta.innerHTML+='<span class="obj-card-dot"></span>';
  if(meta.innerHTML) card.appendChild(meta);

  // Dates — always shown
  const dateStart=fmtDateShortStr(o.dateStart);
  const dateEnd=fmtDateShortStr(o.dateEnd);
  if(dateStart||dateEnd){
    const dates=document.createElement('div');
    dates.className='obj-card-dates';
    dates.textContent=(dateStart?'▶ '+dateStart:'')+(dateStart&&dateEnd?' → ':'')+(dateEnd?dateEnd:'');
    card.appendChild(dates);
  }

  // Notes — always expanded below name (no sticker)
  if(hasNotes){
    const notesDiv=document.createElement('div');
    notesDiv.style.cssText='margin-top:4px;display:flex;flex-direction:column;gap:1px';
    const sorted=[...o.notes].sort((a,b)=>(isNoteActive(b)?1:0)-(isNoteActive(a)?1:0));
    sorted.forEach((n,ni)=>{
      const active=isNoteActive(n);
      const row=document.createElement('div');
      row.style.cssText='display:flex;align-items:baseline;gap:3px;flex-wrap:wrap';
      const txt=document.createElement('span');
      txt.style.cssText='font-size:15px;color:'+(active?'#c0392b':'#444')+';cursor:pointer;line-height:1.3';
      txt.textContent='— '+n.text;
      txt.onclick=()=>openNoteEditModal(i,ni);
      row.appendChild(txt);
      if(n.time){
        const t=document.createElement('span');
        t.style.cssText='font-size:12px;color:'+(active?'#c0392b':'#bbb');
        t.textContent=fmtDT(n.time);
        row.appendChild(t);
      }
      notesDiv.appendChild(row);
    });
    card.appendChild(notesDiv);
  }

  return card;
}
